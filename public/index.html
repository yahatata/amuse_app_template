<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amuse App - ホーム</title>
    <style>
      :root {
        --primary-color: #3a3a3a;
        --primary-color-dark: #2a2a2a;
        --primary-gradient: linear-gradient(135deg, #3a3a3a, #2a2a2a);
        --primary-shadow: rgba(58, 58, 58, 0.4);
        --primary-shadow-light: rgba(58, 58, 58, 0.1);
        --primary-shadow-hover: rgba(58, 58, 58, 0.3);
      }
      
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background: var(--primary-gradient);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        text-align: center;
        max-width: 500px;
        width: 90%;
      }
      
      h1 {
        color: #333;
        margin-bottom: 30px;
        font-size: 2.5em;
        font-weight: 300;
      }
      
      .description {
        color: #666;
        margin-bottom: 40px;
        line-height: 1.6;
        font-size: 1.1em;
      }
      
      .button-group {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }
      
      .btn {
        padding: 15px 30px;
        border: none;
        border-radius: 50px;
        font-size: 1.1em;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        min-width: 150px;
      }
      
      .btn-user {
        background: var(--primary-gradient);
        color: white;
      }
      
      .btn-user:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px var(--primary-shadow-hover);
      }
      
      .btn-staff {
        background: linear-gradient(45deg, #f093fb, #f5576c);
        color: white;
      }
      
      .btn-staff:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(240, 147, 251, 0.3);
      }
      
      .footer {
        margin-top: 40px;
        color: #999;
        font-size: 0.9em;
      }
      
      @media (max-width: 600px) {
        .container {
          padding: 30px 20px;
        }
        
        h1 {
          font-size: 2em;
        }
        
        .button-group {
          flex-direction: column;
          align-items: center;
        }
        
        .btn {
          width: 100%;
          max-width: 250px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎉 Amuse App</h1>
      <p class="description">
        ようこそ！Amuse Appへ<br>
        ユーザーまたはスタッフとしてログインしてください
      </p>
      
      <div class="button-group">
        <a href="/user/" class="btn btn-user">
          👤 ユーザー
        </a>
        <a href="/staff/" class="btn btn-staff">
          👨‍💼 スタッフ
        </a>
      </div>
      
      <div class="footer">
        <p>LINEログインが必要です</p>
      </div>
    </div>
    
    <script>
      // ページ読み込み時のアニメーション
      document.addEventListener('DOMContentLoaded', function() {
        const container = document.querySelector('.container');
        container.style.opacity = '0';
        container.style.transform = 'translateY(20px)';
        
        setTimeout(() => {
          container.style.transition = 'all 0.6s ease';
          container.style.opacity = '1';
          container.style.transform = 'translateY(0)';
        }, 100);
      });
    </script>
  </body>
</html>
