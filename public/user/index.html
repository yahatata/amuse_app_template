      <!-- プロフィール画面 -->
      <div id="profile-page" class="page profile-page" style="display: none;">
        <h1>プロフィール</h1>
        <div id="profile-info" class="profile-info">
          <div class="spinner"></div>
        </div>
        <div class="profile-actions">
          <button class="btn" onclick="showHomePage()">ホームに戻る</button>
        </div>
      </div>

      <!-- エラー表示 -->
      <div id="error-message" class="error" style="display: none;"></div>
    </div>
    
    <!-- カートを見るボタン（画面下部固定） - .containerの外側に配置 -->
    <div id="view-cart-btn-container" class="view-cart-btn-container" style="display: none;">
      <button class="btn view-cart-btn" onclick="openCartModal()">
        🛒 カートを見る (<span id="cart-badge-count">0</span>)
      </button>
    </div>

    <script type="module">
      // ページ要素の取得
      const loadingEl = document.getElementById('loading');
      const homePageEl = document.getElementById('home-page');
      const registrationPageEl = document.getElementById('registration-page');
      const qrPageEl = document.getElementById('qr-page');
      const orderPageEl = document.getElementById('order-page');
      const orderHistoryPageEl = document.getElementById('order-history-page');
      const tournamentPageEl = document.getElementById('tournament-page');
      const profilePageEl = document.getElementById('profile-page');
      const errorEl = document.getElementById('error-message');
      const userInfoEl = document.getElementById('user-info');
      const registrationFormEl = document.getElementById('registration-form');
      const progressFillEl = document.getElementById('progress-fill');
      window.updateInitProgress = (percent) => { if (progressFillEl) progressFillEl.style.width = Math.min(100, Math.max(0, percent)) + '%'; };

      // カレンダー用の変数
      let calendarCurrentMonth = new Date();
      let calendarSelectedDateStr = null;
      let calendarClickEventsBound = false;
      let allTournamentsData = null; // null=未取得/invalidated, []=正常0件

      // ページ読み込み完了時の初期化処理
      document.addEventListener('DOMContentLoaded', function() {
        // 注文・トーナメントボタンを確実に非表示にする
        const orderBtn = document.getElementById('order-btn');
        const tournamentBtn = document.getElementById('tournament-btn');
        if (orderBtn) orderBtn.style.display = 'none';
        if (tournamentBtn) tournamentBtn.style.display = 'none';
      });

      // === ローディング制御用の共通関数 ===
      
      // グローバルローディングオーバーレイ表示
      function showGlobalLoading(message = '処理中...') {
        const overlay = document.getElementById('global-loading-overlay');
        if (!overlay) return;
        const msgEl = overlay.querySelector('.global-loading-message');
        if (msgEl) msgEl.textContent = message;
        overlay.style.display = 'flex';
      }
      
      // グローバルローディングオーバーレイ非表示
      function hideGlobalLoading() {
        const overlay = document.getElementById('global-loading-overlay');
        if (overlay) overlay.style.display = 'none';
      }

      function setQrSectionBusy(busy) {
        const container = document.querySelector('#qr-page .qr-container');
        if (!container) return;
        container.classList.add('busy-overlay-host');
        let ov = container.querySelector(':scope > .section-busy-overlay');
        if (!ov) {
          ov = document.createElement('div');
          ov.className = 'section-busy-overlay';
          ov.innerHTML = '<div class="spinner"></div>';
          container.appendChild(ov);
        }
        ov.classList.toggle('is-visible', !!busy);
        document.querySelectorAll('#qr-page .qr-actions .btn').forEach((b) => {
          b.disabled = !!busy;
        });
      }

      function setCartModalOrderBusy(busy, message = '注文送信中…') {
        const mc = document.querySelector('#cart-modal .cart-modal-content');
        if (!mc) return;
        let ov = mc.querySelector(':scope > .section-busy-overlay');
        if (!ov) {
          ov = document.createElement('div');
          mc.appendChild(ov);
        }
        if (!ov.classList.contains('section-busy-overlay--dim-card')) {
          ov.className = 'section-busy-overlay section-busy-overlay--dim-card';
          ov.innerHTML =
            '<div class="section-busy-card"><div class="spinner"></div><p class="section-busy-message"></p></div>';
        }
        if (busy) {
          const msgEl = ov.querySelector('.section-busy-message');
          if (msgEl) msgEl.textContent = message;
        }
        ov.classList.toggle('is-visible', !!busy);
        const closeBtn = document.querySelector('#cart-modal .modal-close-btn');
        if (closeBtn) closeBtn.disabled = !!busy || (typeof isCartLocked === 'function' && isCartLocked());
        orderPageEl.classList.toggle('order-flow-busy', !!busy);
        if (typeof applyOrderLockUi === 'function') applyOrderLockUi();
      }

      function setMenuItemsOrderBusy(busy) {
        const mi = document.getElementById('menu-items');
        if (!mi) return;
        mi.classList.add('busy-overlay-host');
        let ov = document.getElementById('menu-items-busy-overlay');
        if (!ov) {
          ov = document.createElement('div');
          ov.id = 'menu-items-busy-overlay';
          mi.appendChild(ov);
        }
        if (!ov.classList.contains('section-busy-overlay--dim-card')) {
          ov.className = 'section-busy-overlay section-busy-overlay--dim-card';
          ov.innerHTML =
            '<div class="section-busy-card"><div class="spinner"></div><p class="section-busy-message">注文送信中…</p></div>';
        }
        ov.classList.toggle('is-visible', !!busy);
        orderPageEl.classList.toggle('order-flow-busy', !!busy);
      }
      
      // ボタン付き処理のローディング制御
      async function executeWithButtonLoading(asyncFunction, button, loadingText = '処理中...') {
        if (!button) {
          throw new Error('Button element is required');
        }
        
        const originalText = button.textContent;
        const originalDisabled = button.disabled;
        
        try {
          button.disabled = true;
          button.textContent = loadingText;
          
          const result = await asyncFunction();
          return result;
          
        } catch (error) {
          throw error;
        } finally {
          button.disabled = originalDisabled;
          button.textContent = originalText;
        }
      }
      
      // グローバルローディング付き処理の実行
      async function executeWithGlobalLoading(asyncFunction, message = '処理中...') {
        try {
          showGlobalLoading(message);
          const result = await asyncFunction();
          return result;
        } catch (error) {
          throw error;
        } finally {
          hideGlobalLoading();
        }
      }

      // エラー表示関数（resolver の message のみ。raw error は表示しない）
      function showUserFacingError(resolved, options = {}) {
        const retry = options.retry === true;
        const onRetry = typeof options.onRetry === 'function' ? options.onRetry : null;
        const message =
          resolved && typeof resolved.message === 'string' && resolved.message.trim()
            ? resolved.message
            : (window.LiffErrors && window.LiffErrors.MESSAGES
              ? window.LiffErrors.MESSAGES.PROCESS
              : '処理に失敗しました。時間をおいてもう一度お試しください。');
        const retryLabel =
          (resolved && resolved.retryLabel) ||
          (window.LiffErrors && window.LiffErrors.MESSAGES && window.LiffErrors.MESSAGES.RETRY) ||
          '再試行';

        errorEl.innerHTML = '';
        errorEl.appendChild(document.createTextNode(message));
        if (retry && onRetry) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn primary-btn';
          btn.textContent = retryLabel;
          btn.style.marginTop = '15px';
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            errorEl.style.display = 'none';
            onRetry();
          });
          errorEl.appendChild(btn);
        }
        errorEl.style.display = 'block';
        errorEl.style.whiteSpace = 'pre-wrap';
        loadingEl.style.display = 'none';
      }

      function resolveForDisplay(messageOrResolved, error) {
        const LE = window.LiffErrors;
        if (messageOrResolved && typeof messageOrResolved === 'object' && typeof messageOrResolved.message === 'string') {
          return messageOrResolved;
        }
        if (error && LE) {
          return LE.resolveUserFacingError({ error });
        }
        if (typeof messageOrResolved === 'string' && messageOrResolved.trim()) {
          return { message: messageOrResolved, action: null, retryLabel: null, kind: 'unknown' };
        }
        if (LE) return LE.resolveUserFacingError({});
        return { message: '処理に失敗しました。時間をおいてもう一度お試しください。', action: 'retry', retryLabel: '再試行', kind: 'unknown' };
      }

      function showError(message, error) {
        // 第2引数の raw error は表示に使わない（互換のため受け取るのみ）
        void error;
        showUserFacingError(resolveForDisplay(message, null), { retry: false });
      }

      const INIT_TIMEOUT_MS = 15000;       // 15秒
      const INIT_SLOW_WARN_MS = 5000;      // 5秒
      const SLOW_WARN_MESSAGE = '処理に時間がかかっています....';

      function resolveInitTimeout() {
        if (window.LiffErrors) {
          return window.LiffErrors.resolveUserFacingError({ stage: 'init.timeout' });
        }
        return { message: '処理に時間がかかっています。もう一度お試しください。', action: 'retry', retryLabel: '再試行', kind: 'timeout' };
      }

      function makeInitRetryHandler() {
        return () => {
          const r = () => location.reload();
          const a = window.Firebase?.auth;
          a ? Promise.race([a.signOut(), new Promise(x => setTimeout(x, 2000))]).then(r).catch(r) : r();
        };
      }

      // エラー表示＋再試行ボタン（タイムアウト・初期化失敗時）
      function showErrorWithRetry(message, error, onRetry) {
        // raw error は表示に使わない。stage 付き error のみ解決に使用
        const hasStage = error && typeof error === 'object' && error.liffStage;
        const resolved = hasStage
          ? resolveForDisplay(null, error)
          : resolveForDisplay(message, null);
        const canRetry = typeof onRetry === 'function' && resolved.action !== null;
        showUserFacingError(resolved, { retry: canRetry, onRetry: canRetry ? onRetry : null });
      }

      // ページ表示関数
      function showPage(pageElement) {
        loadingEl.style.display = 'none';

        // QR画面離脱時は期限timerを解除
        if (pageElement !== qrPageEl && typeof clearQrExpiryTimer === 'function') {
          clearQrExpiryTimer();
        }
        
        // 全てのページを明示的に非表示
        homePageEl.style.display = 'none';
        registrationPageEl.style.display = 'none';
        qrPageEl.style.display = 'none';
        orderPageEl.style.display = 'none';
        orderHistoryPageEl.style.display = 'none';
        tournamentPageEl.classList.remove('active');
        profilePageEl.style.display = 'none';
        
        // 全てのページのactiveクラスを確実に削除
        homePageEl.classList.remove('active');
        registrationPageEl.classList.remove('active');
        qrPageEl.classList.remove('active');
        orderPageEl.classList.remove('active');
        orderHistoryPageEl.classList.remove('active');
        tournamentPageEl.classList.remove('active');
        profilePageEl.classList.remove('active');
        
        // カートボタンの表示制御：注文ページのみ表示（カートが空でない場合）
        const viewCartBtnContainer = document.getElementById('view-cart-btn-container');
        if (pageElement === orderPageEl) {
          // 注文ページの場合、カートに商品があれば表示（updateCartDisplayが制御）
          // ここでは何もしない（updateCartDisplayに任せる）
        } else {
          // 注文ページ以外では常に非表示
          if (viewCartBtnContainer) {
            viewCartBtnContainer.style.display = 'none';
          }
        }
        
        // 対象ページのみ表示してactiveクラスを追加
        pageElement.style.display = 'block';
        pageElement.classList.add('active');
      }

      // URLハッシュナビゲーション処理
      async function handleHashNavigation() {
        const hash = window.location.hash;
        
        // ハッシュに応じてページ遷移
        if (hash === '#qr') {
          await showQRCode();
        } else if (hash === '#order') {
          await showOrderPage();
        } else if (hash === '#history') {
          window.showOrderHistory();
        } else if (hash === '#tournament') {
          window.showTournament();
        } else if (hash === '#profile') {
          window.showProfilePage();
        } else {
          // ハッシュがない場合はホームページを表示
          showPage(homePageEl);
        }
      }

      // --- 入店状態（true / false / 'unknown'） ---
      window.userStayingStatus = 'unknown';
      let checkinIntervalId = null;
      let checkinInFlight = false;
      let checkinPollUserId = null;
      let checkinGeneration = 0;

      function stopCheckinPolling() {
        if (checkinIntervalId != null) {
          clearInterval(checkinIntervalId);
          checkinIntervalId = null;
        }
        checkinPollUserId = null;
      }

      function startCheckinPolling(userId) {
        stopCheckinPolling();
        checkinPollUserId = userId;
        checkinIntervalId = setInterval(() => {
          if (checkinPollUserId) updateCheckinStatusUI(checkinPollUserId, { fromInterval: true });
        }, 30000);
      }

      function applyStayStatusUI(status) {
        const LE = window.LiffErrors;
        const normalized = LE
          ? LE.normalizeStayStatus(status)
          : (status === true || status === false ? status : 'unknown');
        window.userStayingStatus = normalized;

        const statusStayingEl = document.getElementById('status-staying');
        const statusNotStayingEl = document.getElementById('status-not-staying');
        const statusDescriptionEl = document.getElementById('status-description');
        const orderBtn = document.getElementById('order-btn');
        const tournamentBtn = document.getElementById('tournament-btn');
        const statusSepEl = statusStayingEl
          ? statusStayingEl.parentElement && statusStayingEl.parentElement.querySelector('span[style*="color: #999"]')
          : null;

        if (tournamentBtn) tournamentBtn.style.display = 'block';

        if (normalized === 'unknown') {
          const unknownLabel = (LE && LE.MESSAGES.CHECKIN_UNKNOWN) || '確認できません';
          if (statusStayingEl) {
            statusStayingEl.textContent = unknownLabel;
            statusStayingEl.style.color = '#999';
            statusStayingEl.style.fontWeight = 'bold';
            statusStayingEl.style.fontSize = '1.5em';
            statusStayingEl.style.backgroundColor = 'transparent';
            statusStayingEl.style.padding = '0';
            statusStayingEl.style.borderRadius = '0';
            statusStayingEl.style.display = 'inline-block';
          }
          if (statusNotStayingEl) statusNotStayingEl.style.display = 'none';
          if (statusSepEl) statusSepEl.style.display = 'none';
          if (statusDescriptionEl) {
            statusDescriptionEl.textContent = '';
            statusDescriptionEl.style.display = 'none';
          }
          if (orderBtn) orderBtn.style.display = 'none';
          return;
        }

        if (statusStayingEl) {
          statusStayingEl.textContent = '入店中';
          statusStayingEl.style.display = 'inline-block';
        }
        if (statusNotStayingEl) {
          statusNotStayingEl.style.display = 'inline-block';
          statusNotStayingEl.textContent = '未入店';
        }
        if (statusSepEl) statusSepEl.style.display = '';

        if (normalized === true) {
          if (statusStayingEl) {
            statusStayingEl.style.backgroundColor = '#1B5E20';
            statusStayingEl.style.color = 'white';
            statusStayingEl.style.fontWeight = 'bold';
            statusStayingEl.style.padding = '6px 12px';
            statusStayingEl.style.borderRadius = '12px';
            statusStayingEl.style.fontSize = '1.2em';
          }
          if (statusNotStayingEl) {
            statusNotStayingEl.style.color = '#999';
            statusNotStayingEl.style.fontWeight = 'normal';
            statusNotStayingEl.style.fontSize = '1.5em';
            statusNotStayingEl.style.backgroundColor = 'transparent';
            statusNotStayingEl.style.padding = '0';
            statusNotStayingEl.style.borderRadius = '0';
          }
          if (statusDescriptionEl) {
            statusDescriptionEl.textContent = '※トーナメント参加や注文等が可能です。';
            statusDescriptionEl.style.display = 'block';
            statusDescriptionEl.style.background = 'transparent';
            statusDescriptionEl.style.border = 'none';
            statusDescriptionEl.style.boxShadow = 'none';
            statusDescriptionEl.style.padding = '0';
          }
          if (orderBtn) orderBtn.style.display = 'block';
        } else {
          if (statusStayingEl) {
            statusStayingEl.style.color = '#999';
            statusStayingEl.style.fontWeight = 'normal';
            statusStayingEl.style.fontSize = '1.5em';
            statusStayingEl.style.backgroundColor = 'transparent';
            statusStayingEl.style.padding = '0';
            statusStayingEl.style.borderRadius = '0';
          }
          if (statusNotStayingEl) {
            statusNotStayingEl.style.color = 'red';
            statusNotStayingEl.style.fontWeight = 'bold';
            statusNotStayingEl.style.fontSize = '1.5em';
            statusNotStayingEl.style.backgroundColor = 'transparent';
            statusNotStayingEl.style.padding = '0';
            statusNotStayingEl.style.borderRadius = '0';
          }
          if (statusDescriptionEl) {
            statusDescriptionEl.textContent = '※入店することでトーナメント参加や注文等が可能です。';
            statusDescriptionEl.style.display = 'block';
            statusDescriptionEl.style.background = 'transparent';
            statusDescriptionEl.style.border = 'none';
            statusDescriptionEl.style.boxShadow = 'none';
            statusDescriptionEl.style.padding = '0';
          }
          if (orderBtn) orderBtn.style.display = 'none';
        }

        if (typeof window.refreshTodayTournamentCardsIfCached === 'function') {
          window.refreshTodayTournamentCardsIfCached();
        }
      }

      // store登録確認関数
      async function checkStoreRegistration() {
        if (window._debugLog) window._debugLog('4. checkStoreRegistration開始');
        const LE = window.LiffErrors;
        try {
          const { db } = window.Firebase;
          if (!window.LiffFirebase || !window.LiffFirebase.user) {
            throw LE
              ? LE.createStageError('auth.no_user')
              : new Error('auth.no_user');
          }

          const { user } = window.LiffFirebase;
          const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          const userDocRef = doc(db, 'users', user.uid);
          const userDoc = await getDoc(userDocRef);

          if (userDoc.exists()) {
            if (window._debugLog) window._debugLog('4a. ユーザー登録済み');
            const userData = userDoc.data();
            const pokerName = userData?.pokerName || '未設定';

            // 取得前は unknown（未入店を先出ししない）
            window.userStayingStatus = 'unknown';
            userInfoEl.innerHTML = `
              <p style="font-weight: bold; font-size: 1.5rem; margin-bottom: 15px; color: black; margin-top: 25px;">pokerName: ${pokerName}</p>
              <div style="display: flex; gap: 10px; margin-top: 20px; align-items: center; justify-content: center;">
                <span id="status-staying" style="color: #999; font-size: 1.5em; font-weight: bold; display: inline-block;"></span>
                <span style="color: #999; display: none;">|</span>
                <span id="status-not-staying" style="display: none;"></span>
              </div>
              <p id="status-description" style="margin-top: 8px; font-size: 0.9rem; color: #666; background: transparent; border: none; box-shadow: none; padding: 0; text-align: center; display: none;"></p>
            `;
            applyStayStatusUI('unknown');

            const orderBtn = document.getElementById('order-btn');
            const tournamentBtn = document.getElementById('tournament-btn');
            if (orderBtn) orderBtn.style.display = 'none';
            if (tournamentBtn) tournamentBtn.style.display = 'none';

            await updateCheckinStatusUI(user.uid, { fromInit: true });
            startCheckinPolling(user.uid);

            try {
              await handleHashNavigation();
            } catch (navError) {
              console.error('[ハッシュナビゲーションエラー]');
              showPage(homePageEl);
            }
          } else {
            if (window._debugLog) window._debugLog('4d. ユーザー未登録→登録ページ表示');
            stopCheckinPolling();
            showPage(registrationPageEl);
          }
        } catch (error) {
          if (window._debugLog) window._debugLog('4-ERR. checkStoreRegistrationエラー', true);
          console.error('[登録状態確認エラー]');
          stopCheckinPolling();
          throw error;
        }
      }

      // 登録フォーム処理
      registrationFormEl.addEventListener('submit', async (e) => {
        e.preventDefault();

        const controls = registrationFormEl.querySelectorAll('input, select, button');
        const LE = window.LiffErrors;

        const runRegistration = async () => {
          const pokerName = document.getElementById('pokerName').value;
          const email = document.getElementById('email').value;
          const pin = document.getElementById('pin').value;
          const birthMonth = document.getElementById('birthMonth').value;
          const birthDay = document.getElementById('birthDay').value;

          if (!window.LiffFirebase || !window.LiffFirebase.user) {
            throw LE
              ? LE.createStageError('auth.no_user')
              : new Error('auth.no_user');
          }

          // PIN形式はクライアントで確実に判定できる場合のみ個別文言
          if (!/^\d{4}$/.test(String(pin))) {
            const pinMsg = (LE && LE.MESSAGES.USER_PIN_INVALID) || 'PINは4桁の数字で入力してください。';
            alert(pinMsg);
            return { aborted: true };
          }

          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");
          const createUserAccount = httpsCallable(functions, 'createUserAccount');

          const result = await createUserAccount({
            pokerName: pokerName,
            email: email,
            pin: pin,
            birthMonth: birthMonth,
            birthDay: birthDay
          });

          const data = result && result.data;
          if (!LE || !LE.isCallableSuccessResponse(data)) {
            if (LE) {
              throw Object.assign(new Error('create_user_account_soft_fail'), {
                liffResolved: LE.mapSoftFailResponse(data, { operation: 'create_user_account' }),
              });
            }
            throw new Error('create_user_account_soft_fail');
          }

          if (data.alreadyRegistered === true) {
            alert('このアカウントは既に登録済みです。');
          } else {
            alert((LE && LE.MESSAGES.USER_REGISTER_OK) || '登録が完了しました。');
          }

          const loadingElRegister = document.getElementById('loading');
          if (loadingElRegister) {
            loadingElRegister.style.display = 'block';
          }

          await checkStoreRegistration();
          return { aborted: false };
        };

        controls.forEach((el) => {
          el.disabled = true;
        });

        try {
          const outcome = await executeWithGlobalLoading(runRegistration, '登録処理中…');
          if (outcome && outcome.aborted) return;
        } catch (error) {
          if (error && error.liffResolved) {
            alert(error.liffResolved.message);
          } else if (LE) {
            alert(LE.mapCallableError(error, { operation: 'create_user_account' }).message);
          } else {
            alert('登録に失敗しました。再度お試しください。');
          }
        } finally {
          controls.forEach((el) => {
            el.disabled = false;
          });
        }
      });

      // 入店状態に応じてUIを更新する関数
      async function updateCheckinStatusUI(userId, options = {}) {
        const LE = window.LiffErrors;
        if (checkinInFlight) return;
        checkinInFlight = true;
        const gen = ++checkinGeneration;
        try {
          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");
          const getUserStatus = httpsCallable(functions, 'getUserStatus');

          const result = await getUserStatus({});
          if (gen !== checkinGeneration) return;

          const data = result && result.data;
          if (!LE || !LE.isGetUserStatusShape(data)) {
            applyStayStatusUI('unknown');
            if (!options.fromInterval) {
              if (data && typeof data === 'object' && data.success === false) {
                showErrorWithRetry(
                  LE.mapSoftFailResponse(data, { operation: 'get_user_status' }),
                  null,
                  () => updateCheckinStatusUI(userId, { fromRetry: true })
                );
              } else {
                showErrorWithRetry(
                  LE
                    ? LE.resolveUserFacingError({ operation: 'get_user_status' })
                    : { message: '入店状況を確認できませんでした。再試行してください。', action: 'retry', retryLabel: '再試行' },
                  null,
                  () => updateCheckinStatusUI(userId, { fromRetry: true })
                );
              }
            } else {
              // interval中の失敗はバッジのみunknown（連打alert回避）。注文は無効のまま
            }
            return;
          }

          applyStayStatusUI(data.user.isStaying);
          if (options.fromRetry || options.fromInit) {
            errorEl.style.display = 'none';
          }
        } catch (error) {
          if (gen !== checkinGeneration) return;
          applyStayStatusUI('unknown');
          if (!options.fromInterval) {
            showErrorWithRetry(
              LE
                ? LE.mapCallableError(error, { operation: 'get_user_status' })
                : { message: '入店状況を確認できませんでした。再試行してください。', action: 'retry', retryLabel: '再試行' },
              null,
              () => updateCheckinStatusUI(userId, { fromRetry: true })
            );
          }
        } finally {
          checkinInFlight = false;
        }
      }

      // ページ遷移関数
      window.showHomePage = () => showPage(homePageEl);
      window.showQRPage = () => showPage(qrPageEl);
      window.showOrderPage = async () => {
        showPage(orderPageEl);
        
        // カテゴリー情報とメニューデータを動的に取得
        const menuData = await loadCategoriesAndMenuData();
        
        if (menuData && menuData.categories.length > 0) {
          // デフォルトで最初のカテゴリを表示
          const defaultCategory = menuData.categories[0];
          loadMenuItems(defaultCategory, menuData.allMenuItems);
        }
        
        // カートに商品がある場合、カートボタンを表示
        updateCartDisplay();
      };
      window.showOrderHistory = () => {
        showPage(orderHistoryPageEl);
        loadOrderHistory();
      };
      window.showProfilePage = () => {
        showPage(profilePageEl);
        loadProfile();
      };

      // QRコード関連関数
      let qrExpiryTimerId = null;
      let qrDisplayGeneration = 0;

      function clearQrExpiryTimer() {
        if (qrExpiryTimerId != null) {
          clearTimeout(qrExpiryTimerId);
          qrExpiryTimerId = null;
        }
      }

      function clearQrDisplay() {
        clearQrExpiryTimer();
        const qrDisplay = document.getElementById('qr-code-display');
        const expiryTime = document.getElementById('qr-expiry-time');
        if (qrDisplay) {
          qrDisplay.innerHTML = '';
        }
        if (expiryTime) {
          expiryTime.textContent = '-';
        }
      }

      function showQrResolvedError(resolved, onRetry) {
        clearQrDisplay();
        const qrDisplay = document.getElementById('qr-code-display');
        if (!qrDisplay) {
          showErrorWithRetry(resolved, null, onRetry);
          return;
        }
        qrDisplay.innerHTML = '';
        const p = document.createElement('p');
        p.textContent = resolved.message;
        qrDisplay.appendChild(p);
        if (resolved.action !== null && typeof onRetry === 'function') {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn primary-btn';
          btn.textContent = resolved.retryLabel || '再試行';
          btn.style.marginTop = '15px';
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            onRetry();
          });
          qrDisplay.appendChild(btn);
        }
      }

      function scheduleQrExpiry(expiryDate) {
        clearQrExpiryTimer();
        if (!(expiryDate instanceof Date) || Number.isNaN(expiryDate.getTime())) return;
        const ms = expiryDate.getTime() - Date.now();
        const gen = qrDisplayGeneration;
        const run = async () => {
          if (gen !== qrDisplayGeneration) return;
          if (!qrPageEl || !qrPageEl.classList.contains('active')) return;
          clearQrDisplay();
          try {
            await generateNewQRCode();
          } catch (e) {
            // generateNewQRCode 内で表示済み
          }
        };
        if (ms <= 0) {
          run();
          return;
        }
        qrExpiryTimerId = setTimeout(run, ms);
      }

      window.showQRCode = async () => {
        const LE = window.LiffErrors;
        try {
          showPage(qrPageEl);
          await displayStoredQRCode();
        } catch (error) {
          const resolved = LE
            ? (error && error.liffResolved
              ? error.liffResolved
              : LE.resolveUserFacingError({ operation: 'qr_display' }))
            : { message: 'QRコードを表示できませんでした。再試行してください。', action: 'retry', retryLabel: '再試行' };
          showQrResolvedError(resolved, () => { window.showQRCode(); });
        }
      };

      window.generateNewQR = async () => {
        const LE = window.LiffErrors;
        try {
          setQrSectionBusy(true);
          clearQrDisplay();
          const qrDisplay = document.getElementById('qr-code-display');
          if (qrDisplay) qrDisplay.innerHTML = '<div class="spinner"></div>';
          await generateNewQRCode({ fromUserAction: true });
        } catch (error) {
          const resolved = LE
            ? (error && error.liffResolved
              ? error.liffResolved
              : LE.mapCallableError(error, { operation: 'generate_qr' }))
            : { message: 'QRコードを更新できませんでした。しばらくしてから再度お試しください。', action: 'retry', retryLabel: '再試行' };
          showQrResolvedError(resolved, () => { window.generateNewQR(); });
        } finally {
          setQrSectionBusy(false);
        }
      };

      // QRコード表示関数（Storageから取得）
      async function displayStoredQRCode() {
        const LE = window.LiffErrors;
        const qrDisplay = document.getElementById('qr-code-display');
        const expiryTime = document.getElementById('qr-expiry-time');
        qrDisplayGeneration += 1;
        const gen = qrDisplayGeneration;
        clearQrExpiryTimer();
        qrDisplay.innerHTML = '<div class="spinner"></div>';
        if (expiryTime) expiryTime.textContent = '-';

        try {
          const { auth } = window.Firebase;
          const currentUser = auth.currentUser;

          if (!currentUser) {
            clearQrDisplay();
            const resolved = LE
              ? { message: LE.MESSAGES.QR_AUTH, action: 'retry', retryLabel: LE.MESSAGES.RETRY, kind: 'auth' }
              : { message: 'ログイン情報を確認できませんでした。再試行してください。', action: 'retry', retryLabel: '再試行' };
            const err = new Error('qr_auth');
            err.liffResolved = resolved;
            throw err;
          }

          const { db } = window.Firebase;
          const { doc, getDocFromServer } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          const userDoc = await getDocFromServer(doc(db, 'users', currentUser.uid));
          if (gen !== qrDisplayGeneration) return;

          if (userDoc.exists()) {
            const userData = userDoc.data();

            if (userData.qrCodeUrl && userData.qrExpiresAt) {
              const now = new Date();
              const expiryDate = userData.qrExpiresAt.toDate();
              const isExpired = now > expiryDate;

              if (isExpired) {
                qrDisplay.innerHTML = '<p>QRコードを生成中...</p>';
                await generateNewQRCode();
                return;
              }

              qrDisplay.innerHTML = `<img src="${userData.qrCodeUrl}" alt="QR Code" style="max-width: 300px; width: 100%;">`;
              if (expiryTime) expiryTime.textContent = expiryDate.toLocaleString('ja-JP');
              scheduleQrExpiry(expiryDate);
            } else {
              qrDisplay.innerHTML = '<p>QRコードを生成中...</p>';
              await generateNewQRCode();
            }
          } else {
            clearQrDisplay();
            const resolved = LE
              ? { message: LE.MESSAGES.QR_NO_USER, action: 'retry', retryLabel: LE.MESSAGES.RETRY, kind: 'unknown' }
              : { message: 'ユーザー情報が見つかりません。登録が完了しているか確認してください。', action: 'retry', retryLabel: '再試行' };
            showQrResolvedError(resolved, () => { window.showQRCode(); });
          }
        } catch (error) {
          if (error && error.liffResolved) throw error;
          const resolved = LE
            ? LE.resolveUserFacingError({ operation: 'qr_display' })
            : { message: 'QRコードを表示できませんでした。再試行してください。', action: 'retry', retryLabel: '再試行' };
          const wrap = new Error('qr_load');
          wrap.liffResolved = resolved;
          throw wrap;
        }
      }

      // QR再生成の無限ループ防止用
      let regenInFlight = false;
      let lastRegenAtMs = 0;

      // 新しいQRコード生成関数（内部用）- 60秒ルール適用
      async function generateNewQRCode(options = {}) {
        const LE = window.LiffErrors;
        const now = Date.now();
        const qrDisplay = document.getElementById('qr-code-display');

        if (regenInFlight) {
          if (qrDisplay) qrDisplay.innerHTML = '<p>QRコードを生成中...</p>';
          return;
        }

        if (lastRegenAtMs > 0 && now - lastRegenAtMs < 60000) {
          const remainingSec = Math.ceil((60000 - (now - lastRegenAtMs)) / 1000);
          clearQrExpiryTimer();
          if (qrDisplay) {
            qrDisplay.innerHTML = '<p>QRコードは60秒間隔で再生成できます。<br>あと' + remainingSec + '秒お待ちください。</p>';
          }
          return;
        }

        regenInFlight = true;
        lastRegenAtMs = now;
        if (qrDisplay) qrDisplay.innerHTML = '<div class="spinner"></div>';

        try {
          setQrSectionBusy(true);
          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");
          const generateQRCode = httpsCallable(functions, 'generateQRCode');

          const result = await generateQRCode({ type: 'user' });
          const data = result && result.data;

          if (!LE || !LE.isGenerateQRCodeShape(data)) {
            const resolved = LE
              ? LE.resolveUserFacingError({ operation: 'generate_qr' })
              : { message: 'QRコードを更新できませんでした。しばらくしてから再度お試しください。', action: 'retry', retryLabel: '再試行' };
            clearQrDisplay();
            if (options.fromUserAction) {
              const err = new Error('qr_shape');
              err.liffResolved = resolved;
              throw err;
            }
            showQrResolvedError(resolved, () => { window.generateNewQR(); });
            return;
          }

          // 成功後はサーバー最新を再表示（古いimgを残さない）
          await displayStoredQRCode();
        } catch (error) {
          if (error && error.liffResolved) throw error;
          const resolved = LE
            ? LE.mapCallableError(error, { operation: 'generate_qr' })
            : { message: 'QRコードを更新できませんでした。しばらくしてから再度お試しください。', action: 'retry', retryLabel: '再試行' };
          clearQrDisplay();
          if (options.fromUserAction) {
            const wrap = new Error('qr_generate');
            wrap.liffResolved = resolved;
            throw wrap;
          }
          showQrResolvedError(resolved, () => { window.generateNewQR(); });
        } finally {
          setQrSectionBusy(false);
          regenInFlight = false;
        }
      }

      // 注文メニュー関連関数

      /** LIFF 注文タブの表示順（店舗 config の menuCategories に合わせる） */
      const MENU_CATEGORY_TAB_ORDER = ['フード', 'ノンアルコール', 'アルコール', 'その他'];
      /** 旧データ向け英語キー（固定順の末尾） */
      const LEGACY_MENU_CATEGORY_TAB_ORDER = ['food', 'drink', 'dessert', 'alcohol', 'snack'];

      function sortMenuCategoriesForTabs(categorySet) {
        const ordered = [];
        for (const cat of [...MENU_CATEGORY_TAB_ORDER, ...LEGACY_MENU_CATEGORY_TAB_ORDER]) {
          if (categorySet.has(cat)) {
            ordered.push(cat);
          }
        }
        for (const cat of categorySet) {
          if (cat && cat !== 'Chip' && !ordered.includes(cat)) {
            ordered.push(cat);
          }
        }
        return ordered;
      }

      // ===== Phase L3: メニュー / カート / 注文 / 履歴 =====
      let cart = [];
      let menuLoadGeneration = 0;
      let historyLoadGeneration = 0;
      let isOrderSubmitting = false;
      /** @type {null | { clientNonce: string, fingerprint: string, items: Array<{menuItemId:string,quantity:number}>, state: 'submitting'|'result_unknown' }} */
      let pendingOrder = null;

      function isCartLocked() {
        return isOrderSubmitting || (pendingOrder && pendingOrder.state === 'result_unknown');
      }

      function applyOrderLockUi() {
        const locked = isCartLocked();
        orderPageEl.classList.toggle('order-flow-busy', !!isOrderSubmitting);
        orderPageEl.classList.toggle('order-pending-lock', !!(pendingOrder && pendingOrder.state === 'result_unknown'));
        const orderBtn = document.getElementById('order-all-btn');
        const closeBtn = document.querySelector('#cart-modal .modal-close-btn');
        if (closeBtn) closeBtn.disabled = !!isOrderSubmitting;
        if (orderBtn && !locked && cart.length > 0 && !(pendingOrder && pendingOrder.state === 'result_unknown')) {
          // updateCartDisplay が制御
        }
      }

      function clearPendingOrder() {
        pendingOrder = null;
        applyOrderLockUi();
        updateCartDisplay();
      }

      function invalidateMenuCache() {
        window.cachedMenuData = null;
      }


      async function loadCategoriesAndMenuData() {
        const LE = window.LiffErrors;
        const gen = ++menuLoadGeneration;
        try {
          const { getFunctions, httpsCallable } = await import(
            'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js'
          );
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || 'asia-northeast1');
          const getMenuItems = httpsCallable(functions, 'getMenuItems');
          const result = await getMenuItems({});
          if (gen !== menuLoadGeneration) return null;

          if (!LE.isCallableSuccessResponse(result.data)) {
            invalidateMenuCache();
            const categoryContainer = document.querySelector('.menu-categories');
            if (categoryContainer) categoryContainer.innerHTML = '';
            const menuItemsEl = document.getElementById('menu-items');
            if (menuItemsEl) {
              const display = LE.mapSoftFailResponse(result.data, { operation: 'get_menu_items' });
              menuItemsEl.textContent = '';
              const p = document.createElement('p');
              p.className = 'error-message';
              p.textContent = display.message;
              menuItemsEl.appendChild(p);
              const retryBtn = document.createElement('button');
              retryBtn.className = 'btn secondary-btn';
              retryBtn.textContent = LE.MESSAGES.RETRY;
              retryBtn.onclick = () => { showOrderPage(); };
              menuItemsEl.appendChild(retryBtn);
            }
            return null;
          }
          if (!LE.isGetMenuItemsShape(result.data)) {
            invalidateMenuCache();
            const categoryContainer = document.querySelector('.menu-categories');
            if (categoryContainer) categoryContainer.innerHTML = '';
            const menuItemsEl = document.getElementById('menu-items');
            if (menuItemsEl) {
              const display = LE.resolveUserFacingError({ operation: 'get_menu_items' });
              menuItemsEl.textContent = '';
              const p = document.createElement('p');
              p.className = 'error-message';
              p.textContent = display.message;
              menuItemsEl.appendChild(p);
              const retryBtn = document.createElement('button');
              retryBtn.className = 'btn secondary-btn';
              retryBtn.textContent = LE.MESSAGES.RETRY;
              retryBtn.onclick = () => { showOrderPage(); };
              menuItemsEl.appendChild(retryBtn);
            }
            return null;
          }

          const allMenuItems = result.data.data;
          const availableCategories = new Set(
            allMenuItems.map((item) => item.category).filter((cat) => cat && cat !== 'Chip'),
          );
          const categories = sortMenuCategoriesForTabs(availableCategories);
          const categoryContainer = document.querySelector('.menu-categories');
          if (categoryContainer) {
            if (categories.length === 0) {
              categoryContainer.innerHTML = '';
            } else {
              categoryContainer.innerHTML = categories
                .map(
                  (category, index) => `
              <button class="category-btn ${index === 0 ? 'active' : ''}" onclick='showCategory(${JSON.stringify(category)}, this)'>
                ${getCategoryDisplayName(category)}
              </button>
            `,
                )
                .join('');
            }
          }
          window.cachedMenuData = allMenuItems;
          return { categories, allMenuItems };
        } catch (error) {
          if (gen !== menuLoadGeneration) return null;
          invalidateMenuCache();
          const categoryContainer = document.querySelector('.menu-categories');
          if (categoryContainer) categoryContainer.innerHTML = '';
          const menuItems = document.getElementById('menu-items');
          if (menuItems) {
            const display = LE.mapCallableError(error, { operation: 'get_menu_items' });
            menuItems.textContent = '';
            const p = document.createElement('p');
            p.className = 'error-message';
            p.textContent = display.message;
            menuItems.appendChild(p);
            const retryBtn = document.createElement('button');
            retryBtn.className = 'btn secondary-btn';
            retryBtn.textContent = LE.MESSAGES.RETRY;
            retryBtn.onclick = () => { showOrderPage(); };
            menuItems.appendChild(retryBtn);
          }
          return null;
        }
      }

      function getCategoryDisplayName(category) {
        if (!category || category === 'Chip') {
          return null;
        }
        const categoryNames = {
          フード: 'フード',
          ノンアルコール: 'ノンアルコール',
          アルコール: 'アルコール',
          その他: 'その他',
          food: 'フード',
          drink: 'ドリンク',
          dessert: 'デザート',
          alcohol: 'アルコール',
          snack: 'スナック',
        };
        return categoryNames[category] || category;
      }

      window.showCategory = (category, buttonElement) => {
        document.querySelectorAll('.category-btn').forEach((btn) => btn.classList.remove('active'));
        buttonElement.classList.add('active');
        const cachedData = window.cachedMenuData;
        loadMenuItems(category, cachedData);
      };

      async function loadMenuItems(category, cachedMenuItems = null) {
        const LE = window.LiffErrors;
        const menuItems = document.getElementById('menu-items');
        if (!menuItems) return;
        const gen = menuLoadGeneration;

        try {
          let allMenuItems;
          if (cachedMenuItems) {
            allMenuItems = cachedMenuItems;
          } else {
            menuItems.innerHTML = '<div class="spinner"></div>';
            try {
              const { getFunctions, httpsCallable } = await import(
                'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js'
              );
              const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || 'asia-northeast1');
              const getMenuItems = httpsCallable(functions, 'getMenuItems');
              const result = await getMenuItems({});
              if (gen !== menuLoadGeneration) return;
              if (!LE.isGetMenuItemsShape(result.data)) {
                invalidateMenuCache();
                const resolved = LE.mapSoftFailResponse(
                  { success: false },
                  { operation: 'get_menu_items' },
                );
                menuItems.textContent = '';
                const p = document.createElement('p');
                p.className = 'error-message';
                p.textContent = resolved.message;
                menuItems.appendChild(p);
                return;
              }
              allMenuItems = result.data.data;
              window.cachedMenuData = allMenuItems;
            } catch (error) {
              if (gen !== menuLoadGeneration) return;
              invalidateMenuCache();
              const resolved = LE.mapCallableError(error, { operation: 'get_menu_items' });
              menuItems.textContent = '';
              const p = document.createElement('p');
              p.className = 'error-message';
              p.textContent = resolved.message;
              menuItems.appendChild(p);
              const retryBtn = document.createElement('button');
              retryBtn.className = 'btn secondary-btn';
              retryBtn.textContent = LE.MESSAGES.RETRY;
              retryBtn.onclick = () => loadMenuItems(category, null);
              menuItems.appendChild(retryBtn);
              return;
            }
          }

          if (gen !== menuLoadGeneration) return;
          if (!Array.isArray(allMenuItems)) {
            invalidateMenuCache();
            const resolved = LE.resolveUserFacingError({ operation: 'get_menu_items' });
            menuItems.textContent = '';
            const p = document.createElement('p');
            p.className = 'error-message';
            p.textContent = resolved.message;
            menuItems.appendChild(p);
            return;
          }

          const filteredItems = allMenuItems.filter(
            (item) => item.category === category && !item.isArchive && !item.isSoldOut,
          );

          if (filteredItems.length === 0) {
            menuItems.textContent = '';
            const p = document.createElement('p');
            p.textContent = LE.MESSAGES.MENU_CATEGORY_EMPTY;
            menuItems.appendChild(p);
            return;
          }

          menuItems.innerHTML = filteredItems
            .map(
              (item) => `
            <div class="menu-item">
              <div class="menu-item-image">
                ${item.imageUrl ? `<img src="${item.imageUrl}" alt="" onerror="this.style.display='none'">` : ''}
              </div>
              <div class="menu-item-content">
                <h3></h3>
                <p class="description"></p>
                <p class="price"></p>
                <div class="quantity-selector">
                  <button type="button" class="btn-quantity" data-qty-delta="-1" data-item-id=""></button>
                  <span class="qty-value" data-qty-for="">1</span>
                  <button type="button" class="btn-quantity" data-qty-delta="1" data-item-id=""></button>
                </div>
                <button type="button" class="btn add-to-cart-btn" data-add-cart="1">🛒 カートに追加</button>
              </div>
            </div>
          `,
            )
            .join('');

          const nodes = menuItems.querySelectorAll('.menu-item');
          filteredItems.forEach((item, idx) => {
            const node = nodes[idx];
            if (!node) return;
            node.querySelector('h3').textContent = item.name || '';
            node.querySelector('.description').textContent = item.description || '';
            node.querySelector('.price').textContent = `¥${item.price}`;
            const qtySpan = node.querySelector('.qty-value');
            qtySpan.dataset.qtyFor = item.id;
            qtySpan.id = `quantity-${item.id}`;
            node.querySelectorAll('.btn-quantity').forEach((btn) => {
              btn.dataset.itemId = item.id;
              btn.textContent = btn.dataset.qtyDelta === '-1' ? '-' : '+';
              btn.addEventListener('click', () => {
                changeQuantity(item.id, Number(btn.dataset.qtyDelta));
              });
            });
            const addBtn = node.querySelector('[data-add-cart]');
            addBtn.addEventListener('click', () => {
              addToCart(item.id, item.name, item.price, item.category);
            });
          });
        } catch (error) {
          if (gen !== menuLoadGeneration) return;
          invalidateMenuCache();
          const resolved = LE.mapCallableError(error, { operation: 'get_menu_items' });
          menuItems.textContent = '';
          const p = document.createElement('p');
          p.className = 'error-message';
          p.textContent = resolved.message;
          menuItems.appendChild(p);
        }
      }

      window.changeQuantity = (itemId, change) => {
        if (isCartLocked()) return;
        const quantityElement = document.getElementById(`quantity-${itemId}`);
        if (quantityElement) {
          let currentQuantity = parseInt(quantityElement.textContent, 10) || 1;
          currentQuantity = Math.max(1, Math.min(99, currentQuantity + change));
          quantityElement.textContent = String(currentQuantity);
        }
      };

      window.addToCart = (itemId, itemName, price, category) => {
        if (isCartLocked()) return;
        const quantityElement = document.getElementById(`quantity-${itemId}`);
        const quantity = parseInt(quantityElement && quantityElement.textContent, 10) || 1;
        const existingItemIndex = cart.findIndex((item) => item.menuItemId === itemId);
        if (existingItemIndex !== -1) {
          cart[existingItemIndex].quantity += quantity;
        } else {
          cart.push({
            menuItemId: itemId,
            name: itemName,
            price: price,
            category: category,
            quantity: quantity,
          });
        }
        if (quantityElement) quantityElement.textContent = '1';
        updateCartDisplay();
      };

      function updateCartDisplay() {
        const LE = window.LiffErrors;
        const cartItemsEl = document.getElementById('cart-items');
        const cartItemCountEl = document.getElementById('cart-item-count');
        const cartBadgeCountEl = document.getElementById('cart-badge-count');
        const cartTotalPriceEl = document.getElementById('cart-total-price');
        const orderAllBtn = document.getElementById('order-all-btn');
        const viewCartBtnContainer = document.getElementById('view-cart-btn-container');
        const locked = isCartLocked();

        if (cart.length === 0) {
          cartItemsEl.textContent = '';
          const p = document.createElement('p');
          p.className = 'empty-cart';
          p.textContent = (LE && LE.MESSAGES && LE.MESSAGES.CART_EMPTY) || 'カートが空です';
          cartItemsEl.appendChild(p);
          cartItemCountEl.textContent = '0';
          cartBadgeCountEl.textContent = '0';
          cartTotalPriceEl.textContent = '0';
          orderAllBtn.disabled = true;
          viewCartBtnContainer.style.display = 'none';
          return;
        }

        cartItemsEl.innerHTML = cart
          .map(
            (item, index) => `
          <div class="cart-item">
            <div class="cart-item-info">
              <h4></h4>
              <p class="cart-item-category"></p>
              <p class="cart-item-price"></p>
            </div>
            <div class="cart-item-actions">
              <button type="button" class="btn-quantity" data-cart-qty="-1" data-index="${index}">-</button>
              <span class="cart-item-quantity">${item.quantity}</span>
              <button type="button" class="btn-quantity" data-cart-qty="1" data-index="${index}">+</button>
              <button type="button" class="btn remove-btn" data-cart-remove="${index}">削除</button>
            </div>
          </div>
        `,
          )
          .join('');

        cartItemsEl.querySelectorAll('.cart-item').forEach((node, index) => {
          const item = cart[index];
          node.querySelector('h4').textContent = item.name || '';
          node.querySelector('.cart-item-category').textContent = getCategoryDisplayName(item.category) || '';
          node.querySelector('.cart-item-price').textContent = `¥${item.price} × ${item.quantity}個`;
        });
        cartItemsEl.querySelectorAll('[data-cart-qty]').forEach((btn) => {
          btn.addEventListener('click', () => {
            updateCartItemQuantity(Number(btn.dataset.index), Number(btn.dataset.cartQty));
          });
          if (locked) btn.disabled = true;
        });
        cartItemsEl.querySelectorAll('[data-cart-remove]').forEach((btn) => {
          btn.addEventListener('click', () => removeFromCart(Number(btn.dataset.cartRemove)));
          if (locked) btn.disabled = true;
        });

        const totalPrice = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        cartItemCountEl.textContent = String(totalItems);
        cartBadgeCountEl.textContent = String(totalItems);
        cartTotalPriceEl.textContent = totalPrice.toLocaleString();

        // busy / pending 中は注文ボタンを再有効化しない
        orderAllBtn.disabled = locked || cart.length === 0;

        if (orderPageEl.style.display === 'block' || orderPageEl.classList.contains('active')) {
          viewCartBtnContainer.style.display = 'block';
        } else {
          viewCartBtnContainer.style.display = 'none';
        }

        const clearBtn = document.querySelector('#cart-modal .secondary-btn');
        if (clearBtn) clearBtn.disabled = locked;
      }

      window.openCartModal = () => {
        document.getElementById('cart-modal').style.display = 'flex';
      };

      window.closeCartModal = () => {
        if (isOrderSubmitting) return;
        document.getElementById('cart-modal').style.display = 'none';
      };

      window.updateCartItemQuantity = (index, change) => {
        if (isCartLocked()) return;
        if (index >= 0 && index < cart.length) {
          cart[index].quantity = Math.max(1, Math.min(99, cart[index].quantity + change));
          updateCartDisplay();
        }
      };

      window.removeFromCart = (index) => {
        if (isCartLocked()) return;
        if (index >= 0 && index < cart.length) {
          if (confirm(`${cart[index].name}をカートから削除しますか？`)) {
            cart.splice(index, 1);
            updateCartDisplay();
          }
        }
      };

      window.clearCart = () => {
        if (isCartLocked()) return;
        if (cart.length > 0 && confirm('カートを空にしますか？')) {
          cart = [];
          updateCartDisplay();
        }
      };

      // dead-code 候補（HTML から未配線）— 削除せず維持
      window.orderItem = (itemId, itemName, price, category) => {
        const quantityElement = document.getElementById(`quantity-${itemId}`);
        const quantity = parseInt(quantityElement && quantityElement.textContent, 10) || 1;
        const totalPrice = price * quantity;
        if (confirm(`${itemName} × ${quantity}個 = ¥${totalPrice}\n\nこの注文を確定しますか？`)) {
          processOrder(itemId, itemName, price, quantity, totalPrice, category);
        }
      };

      window.orderAllItems = async () => {
        const LE = window.LiffErrors;
        if (isOrderSubmitting) return;
        if (pendingOrder && pendingOrder.state === 'result_unknown') {
          alert(LE.MESSAGES.ORDER_RESULT_UNKNOWN);
          return;
        }
        if (cart.length === 0) {
          alert(LE.MESSAGES.CART_EMPTY);
          return;
        }

        const normalized = LE.normalizeOrderItemsForRequest(
          cart.map((c) => ({ menuItemId: c.menuItemId, quantity: c.quantity })),
        );
        if (!normalized.ok) {
          const resolved = LE.resolveUserFacingError({
            operation: 'place_order_by_user',
            errorKey: normalized.errorKey,
          });
          alert(resolved.message);
          return;
        }

        const totalQuantity = normalized.items.reduce((s, it) => s + it.quantity, 0);
        const clientPreviewTotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        if (
          !confirm(
            `合計 ${totalQuantity}個 (表示額 ¥${clientPreviewTotal.toLocaleString()})\n\nこの注文を確定しますか？`,
          )
        ) {
          return;
        }

        const orderBtn = document.getElementById('order-all-btn');
        isOrderSubmitting = true;
        setCartModalOrderBusy(true, '注文送信中…');
        if (orderBtn) orderBtn.disabled = true;
        applyOrderLockUi();

        const clientNonce = LE.createClientNonce();
        const fingerprint = LE.buildOrderFingerprint(normalized.items);
        pendingOrder = {
          clientNonce,
          fingerprint,
          items: normalized.items,
          state: 'submitting',
        };

        try {
          const { auth } = window.Firebase;
          if (!auth.currentUser) {
            clearPendingOrder();
            alert(LE.MESSAGES.ORDER_AUTH);
            return;
          }

          const { getFunctions, httpsCallable } = await import(
            'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js'
          );
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || 'asia-northeast1');
          const getUserStatus = httpsCallable(functions, 'getUserStatus');
          const statusResult = await getUserStatus({});

          if (!LE.isGetUserStatusShape(statusResult.data)) {
            clearPendingOrder();
            alert(LE.MESSAGES.ORDER_STAY_UNKNOWN);
            return;
          }
          const stay = LE.normalizeStayStatus(statusResult.data.user.isStaying);
          if (stay === false) {
            clearPendingOrder();
            alert(LE.MESSAGES.ORDER_NOT_STAYING);
            return;
          }
          if (stay !== true) {
            clearPendingOrder();
            alert(LE.MESSAGES.ORDER_STAY_UNKNOWN);
            return;
          }

          const placeOrderByUser = httpsCallable(functions, 'placeOrderByUser');
          let resultData = null;
          let callError = null;
          try {
            const result = await placeOrderByUser({
              clientNonce,
              items: normalized.items,
            });
            resultData = result.data;
          } catch (err) {
            callError = err;
          }

          const classified = LE.classifyPlaceOrderOutcome({
            data: resultData,
            error: callError,
            expectedNonce: clientNonce,
          });

          if (classified.outcome === 'success') {
            alert(LE.MESSAGES.ORDER_SUCCESS);
            cart = [];
            clearPendingOrder();
            updateCartDisplay();
            closeCartModal();
            historyLoadGeneration += 1;
            if (orderHistoryPageEl.classList.contains('active')) {
              loadOrderHistory();
            }
            return;
          }

          if (classified.outcome === 'confirmed_failure') {
            clearPendingOrder();
            alert(classified.resolved.message);
            updateCartDisplay();
            return;
          }

          // result_unknown: nonce / cart 保持、編集ロック
          pendingOrder.state = 'result_unknown';
          alert(LE.MESSAGES.ORDER_RESULT_UNKNOWN);
          updateCartDisplay();
          applyOrderLockUi();
        } finally {
          isOrderSubmitting = false;
          setCartModalOrderBusy(false);
          // pending result_unknown 中はロック維持
          if (!(pendingOrder && pendingOrder.state === 'result_unknown')) {
            if (orderBtn) orderBtn.disabled = cart.length === 0;
          } else if (orderBtn) {
            orderBtn.disabled = true;
          }
          applyOrderLockUi();
        }
      };

      function formatHistoryStatusLabel(order) {
        const billStatus = order.status;
        const names = {
          open: '注文中',
          in_progress: '注文中',
          settling: '会計中',
          settled: '会計済',
          partially_refunded: '会計済',
          refunded: '会計済',
          voided: '取消',
          preparing: '調理中',
          served: '提供済み',
          cancel: 'キャンセル',
          cancelled: 'キャンセル',
        };
        if (typeof billStatus === 'string' && names[billStatus]) return names[billStatus];
        if (typeof billStatus === 'string' && billStatus.trim()) return '受付済み';
        return '受付済み';
      }

      function formatItemStatusLabel(item) {
        if (item && item.voided === true) return 'キャンセル';
        if (item && typeof item.status === 'string' && item.status.trim()) {
          if (item.status === 'preparing') return '調理中';
          if (item.status === 'served') return '提供済み';
          if (item.status === 'cancel' || item.status === 'cancelled') return 'キャンセル';
          return '受付済み';
        }
        return '受付済み';
      }

      async function loadOrderHistory() {
        const LE = window.LiffErrors;
        const historyListEl = document.getElementById('order-history-list');
        const statsEl = document.getElementById('history-stats');
        statsEl.style.display = 'none';
        const gen = ++historyLoadGeneration;

        try {
          historyListEl.innerHTML = '<div class="spinner"></div>';
          const { auth } = window.Firebase;
          if (!auth.currentUser) {
            throw Object.assign(new Error('unauthenticated'), { code: 'unauthenticated' });
          }

          const { getFunctions, httpsCallable } = await import(
            'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js'
          );
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || 'asia-northeast1');
          const getUserOrderHistory = httpsCallable(functions, 'getUserOrderHistory');
          const result = await getUserOrderHistory({});
          if (gen !== historyLoadGeneration) return;

          const payload = result.data;
          if (!LE.isGetUserOrderHistoryShape(payload)) {
            historyListEl.textContent = '';
            const p = document.createElement('p');
            p.className = 'error-message';
            p.textContent = LE.MESSAGES.ORDER_HISTORY_FAIL;
            historyListEl.appendChild(p);
            const retryBtn = document.createElement('button');
            retryBtn.className = 'btn secondary-btn';
            retryBtn.textContent = LE.MESSAGES.RETRY;
            retryBtn.onclick = () => loadOrderHistory();
            historyListEl.appendChild(retryBtn);
            return;
          }

          // pending nonce 照合（全商品一致時のみ成功確定）
          if (pendingOrder && pendingOrder.state === 'result_unknown') {
            const match = LE.matchPendingOrderInHistory(payload, pendingOrder);
            if (match.matched) {
              cart = [];
              clearPendingOrder();
            }
          }

          const orders = payload.data.orders;
          const totalAmount = payload.data.totalAmount;

          if (orders.length === 0) {
            historyListEl.textContent = '';
            const p = document.createElement('p');
            p.className = 'empty-history';
            p.textContent = LE.MESSAGES.ORDER_HISTORY_EMPTY;
            historyListEl.appendChild(p);
            statsEl.style.display = 'flex';
            document.getElementById('total-orders').textContent = '0';
            document.getElementById('total-amount').textContent = '¥0';
            return;
          }

          document.getElementById('total-orders').textContent = String(orders.length);
          document.getElementById('total-amount').textContent = `¥${Number(totalAmount).toLocaleString()}`;
          statsEl.style.display = 'flex';

          historyListEl.textContent = '';
          orders.forEach((order) => {
            const wrap = document.createElement('div');
            wrap.className = 'order-history-item';
            const header = document.createElement('div');
            header.className = 'order-header';
            const info = document.createElement('div');
            info.className = 'order-info';
            const statusEl = document.createElement('span');
            statusEl.className = `order-status status-${order.status || 'open'}`;
            statusEl.textContent = formatHistoryStatusLabel(order);
            info.appendChild(statusEl);
            if (order.orderDate) {
              const timeEl = document.createElement('span');
              timeEl.className = 'order-time';
              timeEl.textContent = String(order.orderDate).replace('T', ' ').slice(0, 16);
              info.appendChild(timeEl);
            }
            const amount = document.createElement('div');
            amount.className = 'order-amount';
            amount.textContent = `¥${Number(order.totalPrice || 0).toLocaleString()}`;
            header.appendChild(info);
            header.appendChild(amount);
            wrap.appendChild(header);

            const itemsEl = document.createElement('div');
            itemsEl.className = 'order-items';
            (order.items || []).forEach((item) => {
              const row = document.createElement('div');
              row.className = 'order-item' + (item.voided ? ' order-item-cancel' : '');
              const name = document.createElement('span');
              name.className = 'item-name';
              name.textContent = item.name || '';
              const details = document.createElement('span');
              details.className = 'item-details';
              details.textContent = `${item.quantity}個 × ¥${Number(item.unitPrice || 0).toLocaleString()}（${formatItemStatusLabel(item)}）`;
              row.appendChild(name);
              row.appendChild(details);
              itemsEl.appendChild(row);
            });
            wrap.appendChild(itemsEl);

            if (order.currentTable) {
              const loc = document.createElement('div');
              loc.className = 'order-location';
              loc.textContent = `テーブル: ${order.currentTable}${
                order.currentSeat != null ? ` (${order.currentSeat})` : ''
              }`;
              wrap.appendChild(loc);
            }
            historyListEl.appendChild(wrap);
          });
        } catch (error) {
          if (gen !== historyLoadGeneration) return;
          historyListEl.textContent = '';
          const resolved = LE.mapCallableError(error, { operation: 'get_user_order_history' });
          const p = document.createElement('p');
          p.className = 'error-message';
          p.textContent = resolved.message;
          historyListEl.appendChild(p);
          const retryBtn = document.createElement('button');
          retryBtn.className = 'btn secondary-btn';
          retryBtn.textContent = LE.MESSAGES.RETRY;
          retryBtn.onclick = () => loadOrderHistory();
          historyListEl.appendChild(retryBtn);
        }
      }

      window.refreshOrderHistory = () => {
        loadOrderHistory();
      };

      function getStatusDisplayName(status) {
        return formatHistoryStatusLabel({ status: status });
      }

      // dead-code 候補（HTML から未配線）
      async function processOrder(itemId, itemName, price, quantity, totalPrice, category) {
        // 到達不能経路。正式経路は orderAllItems。削除は L3-B 後判断。
        return;
      }
      // トーナメント関連関数（Phase L4-B）
      window.liffTournamentSettings = {
        liffRegistrationEnabled: true,
        liffCalendarEnabled: true,
      };
      window.cachedTodayTournaments = null;
      window.cachedUpcomingTournaments = null;
      let activeTournamentTab = 'today';
      let todayTournamentLoadGeneration = 0;
      let upcomingTournamentLoadGeneration = 0;
      let calendarTournamentLoadGeneration = 0;
      let tournamentRegistrationBusy = false;
      let tournamentDeadlineTimerId = null;
      /** @type {{ tournamentId: string, clientNonce: string, state: string, startedAt: number } | null} */
      let pendingTournamentRegistration = null;

      function invalidateTournamentCaches(options) {
        options = options || {};
        window.cachedTodayTournaments = null;
        if (options.upcoming !== false) {
          window.cachedUpcomingTournaments = null;
        }
        if (options.calendar) {
          allTournamentsData = null;
        }
      }

      function isTournamentRegistrationPendingUnknown() {
        return !!(
          pendingTournamentRegistration &&
          pendingTournamentRegistration.state === 'result_unknown'
        );
      }

      function clearPendingTournamentRegistration() {
        pendingTournamentRegistration = null;
      }

      function applyLiffTournamentSettings(liffSettings) {
        if (!liffSettings || typeof liffSettings !== 'object') return;
        window.liffTournamentSettings = {
          liffRegistrationEnabled: liffSettings.liffRegistrationEnabled === true,
          liffCalendarEnabled: liffSettings.liffCalendarEnabled === true,
        };
        const calendarTab = document.getElementById('tournament-calendar-tab');
        if (calendarTab) {
          calendarTab.style.display = window.liffTournamentSettings.liffCalendarEnabled ? '' : 'none';
        }
      }

      function renderTournamentListError(container, onRetry, resolvedOrMessage) {
        const LE = window.LiffErrors;
        let msg =
          (LE && LE.MESSAGES.TOUR_LIST_LOAD_FAILED) ||
          'トーナメント情報を取得できませんでした。再試行してください。';
        if (resolvedOrMessage && typeof resolvedOrMessage === 'object' && resolvedOrMessage.message) {
          msg = resolvedOrMessage.message;
        } else if (typeof resolvedOrMessage === 'string' && resolvedOrMessage) {
          msg = resolvedOrMessage;
        }
        const retryLabel = (LE && LE.MESSAGES.RETRY) || '再試行';
        if (!container) return;
        container.innerHTML =
          '<p class="error-message"></p><button type="button" class="btn tour-list-retry-btn"></button>';
        const p = container.querySelector('.error-message');
        const btn = container.querySelector('.tour-list-retry-btn');
        if (p) p.textContent = msg;
        if (btn) {
          btn.textContent = retryLabel;
          btn.onclick = function () {
            if (typeof onRetry === 'function') onRetry();
          };
        }
      }

      function resolveTournamentListError(operation, error) {
        const LE = window.LiffErrors;
        if (!LE) {
          return {
            message: 'トーナメント情報を取得できませんでした。再試行してください。',
          };
        }
        if (error) {
          return LE.resolveUserFacingError({ operation: operation, error: error });
        }
        return LE.resolveUserFacingError({
          operation: operation,
          errorKey: 'TOURNAMENT_INTERNAL_ERROR',
        });
      }

      function startTournamentDeadlineTimer() {
        if (tournamentDeadlineTimerId != null) return;
        tournamentDeadlineTimerId = setInterval(function () {
          if (activeTournamentTab === 'today' && window.cachedTodayTournaments) {
            renderTodayTournamentList(window.cachedTodayTournaments);
          }
        }, 30000);
      }

      window.refreshTodayTournamentCardsIfCached = function () {
        if (window.cachedTodayTournaments) {
          renderTodayTournamentList(window.cachedTodayTournaments);
        }
      };

      window.showTournament = () => {
        showPage(tournamentPageEl);
        startTournamentDeadlineTimer();
        switchTournamentTab('today');
      };

      window.switchTournamentTab = (tabName) => {
        activeTournamentTab = tabName;
        const panels = {
          today: document.getElementById('tournament-tab-today'),
          upcoming: document.getElementById('tournament-tab-upcoming'),
          calendar: document.getElementById('tournament-tab-calendar'),
        };
        Object.entries(panels).forEach(([key, panel]) => {
          if (panel) panel.style.display = key === tabName ? 'block' : 'none';
        });
        document.querySelectorAll('.tournament-tab-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.tab === tabName);
        });
        if (tabName === 'today') {
          loadTodayTournaments({ force: true });
        } else if (tabName === 'upcoming') {
          loadUpcomingTournaments({ force: true });
        } else if (tabName === 'calendar') {
          loadCalendarTabData({ force: false });
        }
      };

      function formatDateWithDayFromIso(isoString) {
        if (!isoString) return '日付不明';
        return formatDateWithDay(isoString);
      }

      function formatRegEndAtDisplay(isoString) {
        if (!isoString) return '不明';
        return formatTime(isoString);
      }

      function getRegistrationBlockReason(tournament) {
        const LE = window.LiffErrors;
        if (LE && typeof LE.getTournamentRegistrationBlockReason === 'function') {
          return LE.getTournamentRegistrationBlockReason(
            tournament,
            window.userStayingStatus,
            {
              liffRegistrationEnabled:
                window.liffTournamentSettings &&
                window.liffTournamentSettings.liffRegistrationEnabled === true,
            },
          );
        }
        return null;
      }

      function showRegistrationBlockReasonDialog(message) {
        alert(message);
      }

      function renderTournamentCard(tournament, options) {
        const LE = window.LiffErrors;
        const cardKey = options.cardKey;
        const showRegisterButton = options.showRegisterButton === true;
        const showDate = options.showDate === true;
        const timeLabel = showDate
          ? `${formatDate(tournament.startAt)} ${formatTime(tournament.startAt)}`
          : formatTime(tournament.startAt);

        let registerHtml = '';
        if (showRegisterButton) {
          const blockReason = getRegistrationBlockReason(tournament);
          const submitting =
            tournamentRegistrationBusy &&
            pendingTournamentRegistration &&
            pendingTournamentRegistration.tournamentId === tournament.id &&
            pendingTournamentRegistration.state === 'submitting';
          const shortLabel =
            LE && typeof LE.getTournamentRegisterButtonShortLabel === 'function'
              ? LE.getTournamentRegisterButtonShortLabel(tournament, {
                  submitting: !!submitting,
                })
              : '参加登録';
          const disabledVisual =
            !!blockReason ||
            !!submitting ||
            isTournamentRegistrationPendingUnknown() ||
            tournamentRegistrationBusy;
          const btnClass = disabledVisual
            ? 'btn btn-disabled btn-register'
            : 'btn btn-register';
          const ariaDisabled = disabledVisual ? ' aria-disabled="true"' : '';
          registerHtml = `<button type="button" class="${btnClass}"${ariaDisabled} onclick="showTournamentRegistration('${tournament.id}')"></button>`;
        }

        const entryFeeText = `¥${(tournament.entryFee || 0).toLocaleString()}`;
        const stackText = `${(tournament.startStack || 0).toLocaleString()}`;

        const actionsRowHtml = showRegisterButton
          ? `<div class="tournament-card-actions-row">
                <div class="tournament-card-actions-buttons">
                  ${registerHtml}
                </div>
              </div>`
          : '';

        return `
          <div class="tournament-card" data-tournament-id="${tournament.id}">
            <div class="tournament-card-summary">
              <div class="tournament-card-main">
                <h3 class="tournament-card-title"></h3>
                <div class="tournament-card-brief">
                  <p><span class="tournament-card-brief-label">開始時刻:</span> <span class="tournament-card-brief-value">${timeLabel}</span></p>
                  <p><span class="tournament-card-brief-label">参加費:</span> <span class="tournament-card-brief-value">${entryFeeText}</span></p>
                  <p><span class="tournament-card-brief-label">初期スタック:</span> <span class="tournament-card-brief-value">${stackText}</span></p>
                </div>
                ${actionsRowHtml}
              </div>
              <button
                type="button"
                class="tournament-detail-toggle"
                id="${cardKey}-toggle"
                aria-expanded="false"
                onclick="toggleTournamentDetails('${cardKey}')"
              >詳細 <span class="tournament-detail-toggle-icon" aria-hidden="true">▼</span></button>
            </div>
            <div class="tournament-card-details" id="${cardKey}-details" style="display: none;">
              <div class="detail-row">
                <span class="detail-label">レジスト締切:</span>
                <span class="detail-value">${formatRegEndAtDisplay(tournament.regEndAt)}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">リエントリー:</span>
                <span class="detail-value" data-detail="reentry"></span>
              </div>
              <div class="detail-row">
                <span class="detail-label">アドオン:</span>
                <span class="detail-value" data-detail="addon"></span>
