      // フォーマット関数
      function formatDate(timestamp) {
        if (!timestamp) return '日付不明';
        const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return `${date.getMonth() + 1}/${date.getDate()}`;
      }

      function formatDateWithDay(timestamp) {
        if (!timestamp) return '日付不明';
        const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
        const dayOfWeek = weekdays[date.getDay()];
        return `${date.getMonth() + 1}/${date.getDate()} (${dayOfWeek})`;
      }

      function formatTime(timestamp) {
        if (!timestamp) return '時間不明';
        const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
      }

      function formatRegistrationTime(regEndAt, startAt) {
        if (!regEndAt || !startAt) return '不明';

        const regEndDate = regEndAt.toDate ? regEndAt.toDate() : new Date(regEndAt);
        const startDate = startAt.toDate ? startAt.toDate() : new Date(startAt);

        const regEndTime = `${regEndDate.getHours().toString().padStart(2, '0')}:${regEndDate.getMinutes().toString().padStart(2, '0')}`;

        const diffMs = startDate.getTime() - regEndDate.getTime();
        const diffMinutes = Math.round(diffMs / (1000 * 60));

        if (diffMinutes > 0) {
          return `${regEndTime}まで（開始${diffMinutes}分前）`;
        } else if (diffMinutes === 0) {
          return `${regEndTime}（開始時刻と同じ）`;
        } else {
          return `${regEndTime}`;
        }
      }

      function getTournamentStatusDisplay(status) {
        const statusMap = {
          scheduled: '開催予定',

        };
        return statusMap[status] || status || '不明';

      // トーナメント参加登録
      window.showTournamentRegistration = async (tournamentId) => {
        const LE = window.LiffErrors;
        if (!LE) {
          alert('処理に失敗しました。時間をおいてもう一度お試しください。');
          return;
        }

        const guard = LE.getTournamentRegistrationGuard(
          pendingTournamentRegistration,
          tournamentRegistrationBusy,
        );
        if (guard.blockReason === 'pending_lock') {
          alert(LE.MESSAGES.TOUR_PENDING_LOCK);
          return;
        }
        if (guard.blockReason === 'busy') {
          return;
        }

        const tournament = (window.cachedTodayTournaments || []).find(
          (t) => t.id === tournamentId,
        );
        if (tournament) {
          const blockReason = getRegistrationBlockReason(tournament);
          if (blockReason) {
            showRegistrationBlockReasonDialog(blockReason);
            return;
          }
        } else {
          const stay = LE.normalizeStayStatus(window.userStayingStatus);
          if (stay === false) {
            showRegistrationBlockReasonDialog(LE.MESSAGES.TOUR_NOT_STAYING);
            return;
          }
          if (stay === 'unknown') {
            showRegistrationBlockReasonDialog(LE.MESSAGES.TOUR_STAY_UNKNOWN);
            return;
          }
        }

        if (window.liffTournamentSettings.liffRegistrationEnabled !== true) {
          showRegistrationBlockReasonDialog(LE.MESSAGES.TOUR_LIFF_REGISTRATION_DISABLED);
          return;
        }

        const tournamentName = (tournament && tournament.name) || 'このトーナメント';
        if (!confirm(`${tournamentName}に参加登録しますか？`)) {
          return;
        }

        const clientNonce = LE.createClientNonce();
        tournamentRegistrationBusy = true;
        pendingTournamentRegistration = LE.createTournamentRegistrationPending(
          tournamentId,
          clientNonce,
        );
        if (window.cachedTodayTournaments) {
          renderTodayTournamentList(window.cachedTodayTournaments);
        }

        try {
          await executeWithGlobalLoading(async () => {
            const { getFunctions, httpsCallable } = await import(
              'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js'
            );
            const functions = getFunctions(
              window.Firebase.app,
              window.FunctionsRegion || 'asia-northeast1',
            );
            const registerForTournament = httpsCallable(
              functions,
              'registerForTournament',
            );

            let resultData = null;
            let callError = null;
            try {
              const result = await registerForTournament({
                tournamentId,
                clientNonce,
              });
              resultData = result.data;
            } catch (err) {
              callError = err;
            }

            const classified = LE.classifyRegisterForTournamentOutcome({
              data: resultData,
              error: callError,
              expectedTournamentId: tournamentId,
              expectedNonce: clientNonce,
            });

            const next = LE.transitionTournamentRegistrationPending(
              pendingTournamentRegistration,
              classified.outcome,
            );
            pendingTournamentRegistration = next.pending;

            if (classified.outcome === 'success') {
              alert(LE.MESSAGES.TOUR_REGISTRATION_SUCCESS);
              invalidateTournamentCaches({ upcoming: true, calendar: true });
              try {
                await loadTodayTournaments({ force: true });
              } catch (_e) {
                // 登録成功は覆さない
              }
              return;
            }

            if (classified.outcome === 'confirmed_failure') {
              alert(classified.resolved.message);
              if (
                classified.resolved.message === LE.MESSAGES.TOUR_ALREADY_REGISTERED
              ) {
                invalidateTournamentCaches({ upcoming: false });
                await loadTodayTournaments({ force: true });
              }
              return;
            }

            // result_unknown: busy は finally で解除、pending/nonce は保持
            alert(LE.MESSAGES.TOUR_REGISTRATION_RESULT_UNKNOWN);
          }, LE.MESSAGES.TOUR_BTN_SUBMITTING);
        } finally {
          tournamentRegistrationBusy = false;
          if (window.cachedTodayTournaments) {
            renderTodayTournamentList(window.cachedTodayTournaments);
          }
        }
      };

      /** A-7: 有効残高のみを項目ごとに表示（プロフィール用・控えめ） */
      async function buildProfileBalancesHtml(userData) {
        const LE = window.LiffErrors;
        try {
          const { db } = window.Firebase;
          const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          const configSnap = await getDoc(doc(db, 'storeMeta', 'config'));
          const cfg = configSnap.exists() ? (configSnap.data() || {}) : {};
          const pointSettings = cfg.pointSettings || {};
          const chipSettings = cfg.sideGameChipSettings || {};
          const currencyIds = ['pointA', 'pointB', 'pointC', 'pointD', 'pointE'];
          const rows = [];
          for (const id of currencyIds) {
            const slot = pointSettings[id];
            if (!slot || slot.enabled !== true) continue;
            const name = (typeof slot.displayName === 'string' && slot.displayName.trim())
              ? slot.displayName.trim()
              : `${id}（名称未設定）`;
            rows.push({ id, name });
          }
          if (chipSettings && chipSettings.enabled === true) {
            const name = (typeof chipSettings.displayName === 'string' && chipSettings.displayName.trim())
              ? chipSettings.displayName.trim()
              : 'sideGameChip（名称未設定）';
            rows.push({ id: 'sideGameChip', name });
          }
          const corruptLabel = (LE && LE.MESSAGES.BALANCE_CORRUPT) || 'データ不整合';
          const formatBal = (raw) => {
            if (raw === undefined) return '0';
            if (raw === null) return corruptLabel;
            if (typeof raw === 'number' && Number.isInteger(raw) && raw >= 0) {
              return raw.toLocaleString('ja-JP');
            }
            return corruptLabel;
          };
          if (rows.length === 0) {
            return '';
          }
          return `
            <div class="profile-balances" style="margin-top:12px;">
              ${rows.map((r) =>
                `<p style="margin:4px 0;"><strong>${r.name}:</strong> ${formatBal(userData?.[r.id])}</p>`
              ).join('')}
            </div>
          `;
        } catch (e) {
          const msg = (LE && LE.MESSAGES.BALANCE_CONFIG) || '残高の表示設定を取得できませんでした。';
          return `<p style="margin-top:12px;color:#c62828;font-size:0.9rem;">${msg}</p>`;
        }
      }

      function showProfileResolved(resolved, onRetry) {
        const profileInfo = document.getElementById('profile-info');
        if (!profileInfo) return;
        profileInfo.innerHTML = '';
        const p = document.createElement('p');
        p.textContent = resolved.message;
        profileInfo.appendChild(p);
        if (resolved.action !== null && typeof onRetry === 'function') {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn primary-btn';
          btn.textContent = resolved.retryLabel || '再試行';
          btn.style.marginTop = '15px';
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            onRetry();
          });
          profileInfo.appendChild(btn);
        }
      }

      let profileLoadInFlight = false;
      async function loadProfile() {
        if (profileLoadInFlight) return;
        profileLoadInFlight = true;
        const LE = window.LiffErrors;
        const profileInfo = document.getElementById('profile-info');
        profileInfo.innerHTML = '<div class="spinner"></div>';

        try {
          if (!window.LiffFirebase || !window.LiffFirebase.user) {
            showProfileResolved(
              LE
                ? { message: LE.MESSAGES.QR_AUTH, action: 'retry', retryLabel: LE.MESSAGES.RETRY, kind: 'auth' }
                : { message: 'ログイン情報を確認できませんでした。再試行してください。', action: 'retry', retryLabel: '再試行' },
              () => loadProfile()
            );
            return;
          }

          const { db } = window.Firebase;
          const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          const userDoc = await getDoc(doc(db, 'users', window.LiffFirebase.user.uid));

          if (!userDoc.exists()) {
            showProfileResolved(
              LE
                ? { message: LE.MESSAGES.PROFILE_MISSING, action: 'retry', retryLabel: LE.MESSAGES.RETRY, kind: 'unknown' }
                : { message: 'ユーザー情報が見つかりません。登録が完了しているか確認してください。', action: 'retry', retryLabel: '再試行' },

      // 初期化処理（再試行時は isRetry=true で signOut を先に実行）
      async function runUserInitialization(isRetry = false) {
        if (isRetry) {
          try {
            const { auth } = window.Firebase || {};
            if (auth) await auth.signOut();
          } catch (e) { /* サインアウト失敗は無視 */ }
        }

        if (window._debugLog) window._debugLog(isRetry ? '3-RETRY. 再試行開始（signOut済み）' : '3. DOMContentLoaded発火');
        errorEl.style.display = 'none';
        loadingEl.style.display = 'block';
        const loadingRetryContainer = document.getElementById('loading-retry-container');
        if (loadingRetryContainer) { loadingRetryContainer.innerHTML = ''; loadingRetryContainer.style.display = 'none'; }
        if (typeof window.updateInitProgress === 'function') window.updateInitProgress(0);
        let initTimedOut = false;
        const slowWarnId = setTimeout(() => {
          if (initTimedOut) return;
          const retryContainer = document.getElementById('loading-retry-container');
          if (retryContainer) {
            retryContainer.innerHTML = '';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn primary-btn';
            btn.textContent = '再試行';
            btn.onclick = makeInitRetryHandler();
            retryContainer.appendChild(btn);
            retryContainer.style.display = 'block';
          }
        }, INIT_SLOW_WARN_MS);
        const timeoutId = setTimeout(() => {
          initTimedOut = true;
          loadingEl.style.display = 'none';
          showErrorWithRetry(resolveInitTimeout(), null, makeInitRetryHandler());
        }, INIT_TIMEOUT_MS);
        const clearInitTimers = () => { clearTimeout(slowWarnId); clearTimeout(timeoutId); };
          homePageEl.style.display = 'none';
          registrationPageEl.style.display = 'none';
          qrPageEl.style.display = 'none';
          orderPageEl.style.display = 'none';
          orderHistoryPageEl.style.display = 'none';
          tournamentPageEl.style.display = 'none';
          profilePageEl.style.display = 'none';
          
        try {
          if (window._debugLog) window._debugLog('3a. generateBirthdayOptions実行');
          generateBirthdayOptions();
          
          if (window._debugLog) window._debugLog('3b. initLiffAndFirebaseAuth呼び出し');
          try {
          await window.initLiffAndFirebaseAuth();
            if (window.__LIFF_LOGIN_REDIRECTING__) {
              // liff.login() リダイレクト開始済み。後続の登録確認へ進まない
              clearInitTimers();
              return;
            }
            if (window._debugLog) window._debugLog('3c. initLiffAndFirebaseAuth完了');
          } catch (liffError) {
            clearInitTimers();
            if (initTimedOut) return;
            loadingEl.style.display = 'none';
            const LE = window.LiffErrors;
            const resolved = LE
              ? LE.resolveUserFacingError({ error: liffError, operation: 'liff_init' })
              : { message: 'アプリの起動に失敗しました。再試行してください。', action: 'retry', retryLabel: '再試行', kind: 'liff' };
            const canRetry = resolved.action !== null;
            showErrorWithRetry(resolved, liffError, canRetry ? makeInitRetryHandler() : null);
            return;
          }

          if (window._debugLog) window._debugLog('3d. checkStoreRegistration呼び出し');
          try {
          await checkStoreRegistration();
            if (window._debugLog) window._debugLog('3e. checkStoreRegistration完了');
          } catch (checkError) {
            clearInitTimers();
            if (initTimedOut) return;
            loadingEl.style.display = 'none';
            const LE = window.LiffErrors;
            const showRegCheckError = (err) => {
              const resolved = LE
                ? LE.resolveUserFacingError({
                    error: err,
                    operation: 'user_registration_check',
                  })
                : { message: '登録状態を確認できませんでした。再試行してください。', action: 'retry', retryLabel: '再試行', kind: 'unknown' };
              showErrorWithRetry(resolved, null, () => {
                errorEl.style.display = 'none';
                loadingEl.style.display = 'block';
                checkStoreRegistration()
                  .then(() => {
                    loadingEl.style.display = 'none';
                    errorEl.style.display = 'none';
                  })
                  .catch((retryErr) => {
                    loadingEl.style.display = 'none';
                    showRegCheckError(retryErr);
                  });
              });
            };
            showRegCheckError(checkError);
            return;
          }

          clearInitTimers();
          if (initTimedOut) return;
          loadingEl.style.display = 'none';
          errorEl.style.display = 'none';
          if (typeof window.updateInitProgress === 'function') window.updateInitProgress(100);
        } catch (error) {
          clearInitTimers();
          if (initTimedOut) return;
          if (window._debugLog) window._debugLog('3-ERR. 初期化エラー', true);
          loadingEl.style.display = 'none';
          const LE = window.LiffErrors;
          const resolved = LE
            ? LE.resolveUserFacingError({ error, operation: 'liff_init' })
            : { message: 'アプリの起動に失敗しました。再試行してください。', action: 'retry', retryLabel: '再試行', kind: 'unknown' };
          showErrorWithRetry(resolved, error, makeInitRetryHandler());
        }
      }

      function generateBirthdayOptions() {
        const monthSelect = document.getElementById('birthMonth');

        for (let i = 1; i <= 12; i++) {
          const option = document.createElement('option');
          option.value = i.toString().padStart(2, '0');
          option.textContent = i + '月';
          monthSelect.appendChild(option);
        }
        
        // 日のオプションを生成
        for (let i = 1; i <= 31; i++) {
          const option = document.createElement('option');
          option.value = i.toString().padStart(2, '0');
          option.textContent = i + '日';
          daySelect.appendChild(option);
        }
      }

      // メールアドレスフォーマット関数
      function formatEmail(email) {
        if (!email || email === '未設定') {
          return email;
        }
        
        // @の前後で分割して改行を挿入
        const parts = email.split('@');
        if (parts.length === 2) {
          return `${parts[0]}<br>@${parts[1]}`;
        }
        
        return email;
      }

      // ==================================================
      // カレンダー関連の関数
      // ==================================================

      // カレンダータブのデータ読み込み
      async function loadCalendarTabData(opts) {
        opts = opts || {};
        const LE = window.LiffErrors;
        const tournamentCalEl = document.getElementById('tournament-calendar');
        const generation = ++calendarTournamentLoadGeneration;

        try {
          if (tournamentCalEl) {
            tournamentCalEl.innerHTML = '<div class="spinner"></div>';
          }

          if (!opts.force && allTournamentsData !== null) {
            calendarCurrentMonth = calendarCurrentMonth || new Date();
            clampCalendarCurrentMonthToMinimum();
            renderTournamentCalendar();
            return;
          }

          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");
          const getUpcomingTournaments = httpsCallable(functions, 'getUpcomingTournaments');
          const result = await getUpcomingTournaments({ includeAll: true });
          if (generation !== calendarTournamentLoadGeneration) return;

          if (!LE || !LE.isGetUpcomingTournamentsShape(result.data)) {
            allTournamentsData = null;
            if (tournamentCalEl) {
              renderTournamentListError(
                tournamentCalEl,
                () => loadCalendarTabData({ force: true }),
                resolveTournamentListError('get_upcoming_tournaments_calendar', null),
              );
            }
            return;
          }

          applyLiffTournamentSettings(result.data.liffSettings);
          allTournamentsData = result.data.tournaments;
          calendarCurrentMonth = calendarCurrentMonth || new Date();
          clampCalendarCurrentMonthToMinimum();
          renderTournamentCalendar();
        } catch (error) {
          if (generation !== calendarTournamentLoadGeneration) return;
          allTournamentsData = null;
          if (tournamentCalEl) {
            renderTournamentListError(
              tournamentCalEl,
              () => loadCalendarTabData({ force: true }),
              resolveTournamentListError('get_upcoming_tournaments_calendar', error),
            );
          }
        }
      }

      // 後方互換（旧ページ遷移からの呼び出し）
      window.showAllTournamentsCalendar = loadCalendarTabData;

      function formatTournamentCalendarDateStr(year, month, day) {
        return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      }

      /** カレンダー表示の下限: 当月（当月内の過去日付は表示可）。 */
      function isBeforeCurrentCalendarMonth(date) {
        const now = new Date();
        const year = date.getFullYear();
        const month = date.getMonth();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();
        return year < currentYear || (year === currentYear && month < currentMonth);
      }

      function isCurrentCalendarMonth(date) {
        const now = new Date();
        return date.getFullYear() === now.getFullYear()
          && date.getMonth() === now.getMonth();
      }

      function clampCalendarCurrentMonthToMinimum() {
        if (isBeforeCurrentCalendarMonth(calendarCurrentMonth)) {
          const now = new Date();
          calendarCurrentMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        }
      }

      function updateCalendarMonthNavButtons() {
        const prevBtn = document.getElementById('calendar-prev-month-btn');
        if (!prevBtn) return;
        const atMinimum = isCurrentCalendarMonth(calendarCurrentMonth);
        prevBtn.disabled = atMinimum;
        prevBtn.style.opacity = atMinimum ? '0.5' : '1';
        prevBtn.style.cursor = atMinimum ? 'not-allowed' : 'pointer';
      }

      function isJapaneseHoliday(date) {
        try {
          if (typeof window !== 'undefined' &&
              typeof window.JapaneseHolidays !== 'undefined' &&
              window.JapaneseHolidays &&
              typeof window.JapaneseHolidays.isHoliday === 'function') {
            const result = window.JapaneseHolidays.isHoliday(date);
            return result !== undefined && result !== null;
          }
        } catch (error) {
          console.warn('祝日判定ライブラリの呼び出しに失敗:', error);
        }

        const month = date.getMonth() + 1;
        const day = date.getDate();
        const weekday = date.getDay();
        const fixedHolidays = [
          { month: 1, day: 1 },
          { month: 2, day: 11 },
          { month: 2, day: 23 },
          { month: 4, day: 29 },
          { month: 5, day: 3 },
          { month: 5, day: 4 },
          { month: 5, day: 5 },
          { month: 8, day: 11 },
          { month: 11, day: 3 },
          { month: 11, day: 23 },
        ];

        for (const holiday of fixedHolidays) {
          if (holiday.month === month && holiday.day === day) {
            return true;
          }
        }

        if (month === 3 && (day === 20 || day === 21)) return true;
        if (month === 9 && (day === 22 || day === 23)) return true;

        if (month === 7 && weekday === 1) {
          const firstMonday = day - ((day - 1) % 7);
          if (day >= firstMonday + 14 && day < firstMonday + 21) return true;
        }
        if (month === 9 && weekday === 1) {
          const firstMonday = day - ((day - 1) % 7);
          if (day >= firstMonday + 14 && day < firstMonday + 21) return true;
        }
        if (month === 10 && weekday === 1) {
          const firstMonday = day - ((day - 1) % 7);
          if (day >= firstMonday + 7 && day < firstMonday + 14) return true;
        }

        return false;
      }

      function getTournamentCalendarDayColor(currentDate, isToday) {
        const weekday = currentDate.getDay();
        const isHoliday = isJapaneseHoliday(currentDate);
        if (isToday) return '#0000ff';
        if (weekday === 6) return isHoliday ? '#ff0000' : '#0000ff';
        if (weekday === 0 || isHoliday) return '#ff0000';
        return '#000000';
      }

      // トーナメントカレンダーを描画
      function renderTournamentCalendar() {
        const calendar = document.getElementById('tournament-calendar');
        const monthDisplay = document.getElementById('calendar-current-month');
        
        if (!calendar || !monthDisplay) {
          return;
        }

        clampCalendarCurrentMonthToMinimum();
        updateCalendarMonthNavButtons();

        const year = calendarCurrentMonth.getFullYear();
        const month = calendarCurrentMonth.getMonth();
        
        monthDisplay.textContent = `${year}年${month + 1}月`;
        
        // トーナメントを日付ごとにグループ化
        const tournamentsByDate = groupTournamentsByDate(allTournamentsData || [], year, month);
        
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const firstDayOfMonth = firstDay.getDay();
        const daysInMonth = lastDay.getDate();
        
        let calendarHTML = '<div class="calendar-weekdays" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; width: 100%; max-width: 100%;">';
        const weekdayColors = [
          { day: '日', color: '#ff0000' },
          { day: '月', color: '#000000' },
          { day: '火', color: '#000000' },
          { day: '水', color: '#000000' },
          { day: '木', color: '#000000' },
          { day: '金', color: '#000000' },
          { day: '土', color: '#0000ff' },
        ];
        weekdayColors.forEach(({ day, color }) => {
          calendarHTML += `<div class="weekday" style="min-width: 0; width: 100%; box-sizing: border-box; padding: 4px 2px; text-align: center; font-size: 0.8rem; font-weight: bold; color: ${color};">${day}</div>`;
        });
        calendarHTML += '</div>';
        
        calendarHTML += '<div class="calendar-days" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; width: 100%; max-width: 100%;">';
        
        for (let i = 0; i < firstDayOfMonth; i++) {
          calendarHTML += '<div class="calendar-day empty" style="min-width: 0; width: 100%; box-sizing: border-box; padding: 2px; text-align: center; font-size: 0.9rem;"></div>';
        }
        
        for (let day = 1; day <= daysInMonth; day++) {
          const currentDate = new Date(year, month, day);
          const dateStr = formatTournamentCalendarDateStr(year, month, day);
          const isToday = currentDate.toDateString() === new Date().toDateString();
          const dayColor = getTournamentCalendarDayColor(currentDate, isToday);
          
          const tournamentInfo = tournamentsByDate[dateStr] || { regular: 0, oneTime: 0 };
          const hasRegular = tournamentInfo.regular > 0;
          const hasOneTime = tournamentInfo.oneTime > 0;
          const hasTournament = hasRegular || hasOneTime;
          
          let dayClass = 'calendar-day';
          if (isToday) dayClass += ' today';
          if (hasTournament) dayClass += ' has-tournament';
          if (calendarSelectedDateStr === dateStr) dayClass += ' selected';
          
          calendarHTML += `<div class="${dayClass}" data-date="${dateStr}" style="min-width: 0; width: 100%; box-sizing: border-box; padding: 2px; text-align: center; font-size: 0.9rem; position: relative;">`;
          calendarHTML += `<span class="day-number" style="font-weight: bold; color: ${dayColor};">${day}</span>`;
          
          if (hasRegular || hasOneTime) {
            calendarHTML += '<div class="tournament-markers">';
            
            for (let j = 0; j < tournamentInfo.regular; j++) {
              calendarHTML += '<span class="tournament-dot regular"></span>';
            }
            
            for (let j = 0; j < tournamentInfo.oneTime; j++) {
              calendarHTML += '<span class="tournament-dot one-time"></span>';
            }
            
            calendarHTML += '</div>';
          }
          
          calendarHTML += '</div>';
        }
        
        const totalDays = firstDayOfMonth + daysInMonth;
        for (let i = totalDays; i < 42; i++) {
          calendarHTML += '<div class="calendar-day empty" style="min-width: 0; width: 100%; box-sizing: border-box; padding: 2px; text-align: center; font-size: 0.9rem;"></div>';
        }
        
        calendarHTML += '</div>';
        calendar.innerHTML = calendarHTML;
        
        // 日付クリックイベントを設定
        setupCalendarClickEvents();
      }

      // トーナメントを日付ごとにグループ化（種類別）
      function groupTournamentsByDate(tournaments, year, month) {
        const grouped = {};
        
        tournaments.forEach(tournament => {
          if (!tournament.startAt) return;
          
          // startAtは既にISO文字列なのでnew Date()で変換
          const startDate = typeof tournament.startAt === 'string' 
            ? new Date(tournament.startAt)
            : tournament.startAt.toDate(); // Firestore Timestampの場合も考慮
          
          const tournamentYear = startDate.getFullYear();
          const tournamentMonth = startDate.getMonth();
          
          // 指定された月のトーナメントのみカウント
          if (tournamentYear === year && tournamentMonth === month) {
            const dateStr = formatTournamentCalendarDateStr(
              tournamentYear,
              tournamentMonth,
              startDate.getDate()
            );
            
            if (!grouped[dateStr]) {
              grouped[dateStr] = { regular: 0, oneTime: 0 };
            }
            grouped[dateStr].oneTime += 1;
          }
        });
        
        return grouped;
      }

      function clearCalendarDateSelection() {
        calendarSelectedDateStr = null;
        const selectedDateTournamentsEl = document.getElementById('selected-date-tournaments');
        if (selectedDateTournamentsEl) {
          selectedDateTournamentsEl.style.display = 'none';
        }
      }

      function getTournamentsForCalendarDate(dateStr) {
        return (allTournamentsData || []).filter(tournament => {
          if (!tournament.startAt) return false;
          const startDate = typeof tournament.startAt === 'string'
            ? new Date(tournament.startAt)
            : tournament.startAt.toDate();
          return formatTournamentCalendarDateStr(
            startDate.getFullYear(),
            startDate.getMonth(),
            startDate.getDate()
          ) === dateStr;
        });
      }

      // カレンダーの日付クリックイベント（#tournament-calendar に1回だけバインド）
      function setupCalendarClickEvents() {
        const calendar = document.getElementById('tournament-calendar');
        if (!calendar || calendarClickEventsBound) return;
        calendarClickEventsBound = true;

        calendar.addEventListener('click', (e) => {
          const dayCell = e.target.closest('.calendar-day');
          if (!dayCell || dayCell.classList.contains('empty')) return;

          const dateStr = dayCell.dataset.date;
          if (!dateStr) return;

          calendarSelectedDateStr = dateStr;
          renderTournamentCalendar();

          const tournamentsForDate = getTournamentsForCalendarDate(dateStr);
          if (tournamentsForDate.length > 0) {
            showTournamentsForDate(dateStr, tournamentsForDate);
          } else {
            showEmptyTournamentsForDate(dateStr);
          }
        });
      }

      // 指定日のトーナメント一覧を表示
      function showTournamentsForDate(dateStr, tournamentsForDate) {
        const selectedDateTournamentsEl = document.getElementById('selected-date-tournaments');
        const selectedDateTitleEl = document.getElementById('selected-date-title');
        const selectedDateTournamentListEl = document.getElementById('selected-date-tournament-list');
        
        if (!selectedDateTournamentsEl || !selectedDateTitleEl || !selectedDateTournamentListEl) return;
        
        const tournaments = tournamentsForDate || getTournamentsForCalendarDate(dateStr);
        const date = new Date(dateStr + 'T00:00:00');
        
        selectedDateTitleEl.textContent =
          `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日のトーナメント`;
        
        selectedDateTournamentListEl.innerHTML = tournaments.map((tournament, index) =>
          renderTournamentCard(tournament, {
            cardKey: `calendar-${dateStr}-${index}`,
            showRegisterButton: false,
            showDate: true,
          })
        ).join('');
        hydrateTournamentCardDom(selectedDateTournamentListEl, tournaments);

        selectedDateTournamentsEl.style.display = 'block';
        selectedDateTournamentsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function showEmptyTournamentsForDate(dateStr) {
        const selectedDateTournamentsEl = document.getElementById('selected-date-tournaments');
        const selectedDateTitleEl = document.getElementById('selected-date-title');
        const selectedDateTournamentListEl = document.getElementById('selected-date-tournament-list');

        if (!selectedDateTournamentsEl || !selectedDateTitleEl || !selectedDateTournamentListEl) return;

        const date = new Date(dateStr + 'T00:00:00');
        selectedDateTitleEl.textContent =
          `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日のトーナメント`;
        const emptyMsg = (window.LiffErrors && window.LiffErrors.MESSAGES.TOUR_CALENDAR_DATE_EMPTY) ||
          '選択した日のトーナメント予定はありません。';
        selectedDateTournamentListEl.innerHTML =
          '<p class="calendar-no-tournaments-msg" style="margin: 12px 0; color: #666; font-size: 0.95rem; text-align: center;"></p>';
        const emptyEl = selectedDateTournamentListEl.querySelector('.calendar-no-tournaments-msg');
        if (emptyEl) emptyEl.textContent = emptyMsg;

        selectedDateTournamentsEl.style.display = 'block';
        selectedDateTournamentsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // 前月へ移動（当月より前には戻れない）
      window.previousMonth = function() {
        if (isCurrentCalendarMonth(calendarCurrentMonth)) {
          return;
        }
        calendarCurrentMonth.setMonth(calendarCurrentMonth.getMonth() - 1);
        clampCalendarCurrentMonthToMinimum();
        renderTournamentCalendar();
        clearCalendarDateSelection();
      };

      // 次月へ移動
      window.nextMonth = function() {
        calendarCurrentMonth.setMonth(calendarCurrentMonth.getMonth() + 1);
        clampCalendarCurrentMonthToMinimum();
        renderTournamentCalendar();
        clearCalendarDateSelection();
      };

      // トーナメント詳細の表示切り替え
      window.toggleTournamentDetails = function(cardKey) {
        const detailsEl = document.getElementById(`${cardKey}-details`);
        const toggleEl = document.getElementById(`${cardKey}-toggle`);
        if (!detailsEl) return;
        const isVisible = detailsEl.style.display !== 'none';
        const willExpand = !isVisible;
        detailsEl.style.display = willExpand ? 'block' : 'none';
        if (toggleEl) {
          toggleEl.setAttribute('aria-expanded', String(willExpand));
          const iconEl = toggleEl.querySelector('.tournament-detail-toggle-icon');
          if (iconEl) {
            iconEl.textContent = willExpand ? '▲' : '▼';
          }
        }
      };


    </script>
  </body>
