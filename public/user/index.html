    <!-- Firebase初期化スクリプト -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      // 設定ファイルから設定を取得
      const { firebaseConfig, liffId, functionsRegion: configuredFunctionsRegion } = window.__CONFIG__;
      const functionsRegion = configuredFunctionsRegion || "asia-northeast1";
      
      // Cloud Functions URLを動的に生成
      const functionsUrl = `https://${functionsRegion}-${firebaseConfig.projectId}.cloudfunctions.net`;

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // グローバルに公開
      window.Firebase = { app, auth, db };
      window.FirebaseAuth = { signInWithCustomToken };
      window.FunctionsRegion = functionsRegion;
      window.FunctionsUrl = functionsUrl; // グローバルに公開

      function stageError(stage, cause) {
        return window.LiffErrors.createStageError(stage, cause);
      }

      // LIFFとFirebase認証の初期化関数
      window.initLiffAndFirebaseAuth = async function() {
        if (window._debugLog) window._debugLog('2. initLiffAndFirebaseAuth開始');
        window.__LIFF_LOGIN_REDIRECTING__ = false;
        if (!window.liff) {
          if (window._debugLog) window._debugLog('2a. window.liffなし', true);
          throw stageError('liff.sdk_missing');
        }
        try {
          if (window._debugLog) window._debugLog('2b. liff.init実行中');
          try {
            await liff.init({ liffId });
          } catch (initErr) {
            throw stageError('liff.init', initErr);
          }
          if (window._debugLog) window._debugLog('2c. liff.init完了');
          if (typeof window.updateInitProgress === 'function') window.updateInitProgress(20);

          if (!liff.isLoggedIn()) {
            if (window._debugLog) window._debugLog('2d. 未ログイン→liff.login()へリダイレクト');
            window.__LIFF_LOGIN_REDIRECTING__ = true;
            liff.login();
            return;
          }
          if (window._debugLog) window._debugLog('2e. ログイン済み');

          // ミニアプリ用：profile権限の確認と要求（失敗時は表示せず続行）
          try {
            const permissionStatus = await liff.permission.query("profile");
            if (permissionStatus.state === "prompt") {
              await liff.permission.requestAll();
            }
          } catch (permError) {
            console.warn("Permission check not supported or failed");
            // LIFF環境では権限APIが使えない場合があるため、エラーは無視して続行
          }

          if (window._debugLog) window._debugLog('2f. getIDToken取得中');
          let idToken;
          try {
            idToken = await liff.getIDToken();
          } catch (tokenErr) {
            throw stageError('auth.id_token', tokenErr);
          }
          if (idToken == null || String(idToken).trim() === '') {
            throw stageError('auth.id_token');
          }
          if (window._debugLog) window._debugLog('2g. getIDToken取得成功');
          if (typeof window.updateInitProgress === 'function') window.updateInitProgress(40);

          // サーバーからFirebaseカスタムトークンを取得
          if (window._debugLog) window._debugLog('2h. getFirebaseCustomToken呼び出し中');
          let res;
          try {
            res = await fetch(`${functionsUrl}/getFirebaseCustomToken`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${idToken}`,
                "Content-Type": "application/json"
              }
            });
          } catch (fetchErr) {
            throw stageError('auth.custom_token', fetchErr);
          }

          if (!res.ok) {
            if (window._debugLog) window._debugLog('2h-ERR. getFirebaseCustomToken失敗 status=' + res.status, true);
            throw stageError('auth.custom_token');
          }
          if (window._debugLog) window._debugLog('2i. getFirebaseCustomToken成功');
          if (typeof window.updateInitProgress === 'function') window.updateInitProgress(60);

          let tokenPayload;
          try {
            tokenPayload = await res.json();
          } catch (parseErr) {
            throw stageError('auth.custom_token_malformed', parseErr);
          }
          if (!window.LiffErrors.isFirebaseCustomTokenShape(tokenPayload)) {
            throw stageError('auth.custom_token_malformed');
          }
          const firebaseToken = tokenPayload.firebaseToken;

          // Firebase v10 modular SDK対応
          const { auth } = window.Firebase;
          const { signInWithCustomToken } = window.FirebaseAuth;
          const SIGNIN_TIMEOUT_MS = 15000; // 15秒
          const signInStartMs = Date.now();
          if (window._debugLog) window._debugLog('2j. signInWithCustomToken実行中 (タイムアウト=' + SIGNIN_TIMEOUT_MS + 'ms)');
          const waitIntervalMs = 3000;
          const waitIntervalId = setInterval(() => {
            if (window._debugLog) {
              const elapsed = Math.round((Date.now() - signInStartMs) / 1000);
              window._debugLog('2j-wait. signInWithCustomToken待機中 (' + elapsed + '秒経過)');
            }
          }, waitIntervalMs);
          try {
            await Promise.race([
              signInWithCustomToken(auth, firebaseToken),
              new Promise((_, reject) => setTimeout(() => reject(stageError('auth.timeout')), SIGNIN_TIMEOUT_MS))
            ]);
            clearInterval(waitIntervalId);
            if (window._debugLog) window._debugLog('2k. signInWithCustomToken正常完了 (所要' + (Date.now() - signInStartMs) + 'ms)');
          } catch (signInErr) {
            clearInterval(waitIntervalId);
            if (signInErr && signInErr.liffStage) {
              if (window._debugLog) window._debugLog('2j-STAGE. ' + signInErr.liffStage, true);
              throw signInErr;
            }
            if (window._debugLog) window._debugLog('2j-ERR. signInWithCustomToken失敗', true);
            throw stageError('auth.signin', signInErr);
          }
          if (!auth.currentUser) {
            throw stageError('auth.no_user');
          }
          if (window._debugLog) window._debugLog('2k-done. 認証完了');
          if (typeof window.updateInitProgress === 'function') window.updateInitProgress(80);

          // 利用者情報をwindowにセット
          window.LiffFirebase = {
            idToken,
            user: auth.currentUser
          };
        } catch (e) {
          if (window._debugLog) window._debugLog('2-ERR. 認証エラー stage=' + (e?.liffStage || 'unknown'), true);
          console.error("LIFF認証エラー");
          if (e && e.liffStage) throw e;
          throw stageError('liff.init', e);
        }
      };
    </script>

<!-- ========== DEBUG OVERLAY START ==========
  config.js の DEBUG_SHOW_LIFF_PROCESS で表示可否を切り替え。
  詳細: docs/LINEミニアプリ、LIFF/LINEミニアプリ、LIFF処理表示.md -->
<div id="debug-overlay" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:rgba(0,0,0,0.95);color:#fff;font-size:12px;padding:10px;max-height:50vh;overflow-y:auto;font-family:monospace;display:none;">
  <strong>【デバッグ】ユーザーLIFF処理内容表示（時:分:秒形式）</strong>
  <div id="debug-log"></div>
</div>
<script>
  (function() {
    var show = window.__CONFIG__ && window.__CONFIG__.DEBUG_SHOW_LIFF_PROCESS;
    if (!show) {
      window._debugLog = function() {};
      return;
    }
    var overlay = document.getElementById('debug-overlay');
    if (overlay) overlay.style.display = 'block';
    window._debugLog = function(msg, isError) {
      try {
        var el = document.getElementById('debug-log');
        if (!el) return;
        var d = new Date();
        var timeStr = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
        var line = document.createElement('div');
        line.style.color = (isError ? '#ff6b6b' : '#fff');
        line.textContent = '[' + timeStr + '] ' + msg;
        el.appendChild(line);
        el.parentElement.scrollTop = el.parentElement.scrollHeight;
      } catch (e) {}
    };
    window._debugLog('1. ページHTML解析完了');
  })();
</script>

          <div id="upcoming-tournament-list" class="tournament-list">
            <div class="spinner"></div>
          </div>
        </div>

        <div id="tournament-tab-calendar" class="tournament-tab-panel" style="display: none;">
          <div class="calendar-controls" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button type="button" class="btn" id="calendar-prev-month-btn" onclick="previousMonth()" style="padding: 8px 16px;">← 前月</button>
            <h2 id="calendar-current-month" style="margin: 0;">2025年11月</h2>
            <button type="button" class="btn" onclick="nextMonth()" style="padding: 8px 16px;">次月 →</button>
          </div>
          <div class="calendar-container flexible-container-flex">
            <div id="tournament-calendar" class="tournament-calendar calendar-grid flexible-container-flex"></div>
          </div>
          <div id="selected-date-tournaments" class="selected-date-tournaments" style="display: none; margin-top: 20px;">
            <h3 id="selected-date-title"></h3>
            <div id="selected-date-tournament-list" class="tournament-list"></div>
          </div>
        </div>

        <div class="tournament-actions">
          <button type="button" class="btn secondary" onclick="showHomePage()">ホームに戻る</button>
        </div>
