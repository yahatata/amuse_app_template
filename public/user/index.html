    <!-- Firebase初期化スクリプト -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      // 設定ファイルから設定を取得
      const { firebaseConfig, liffId, functionsRegion: configuredFunctionsRegion } = window.__CONFIG__;
      const functionsRegion = configuredFunctionsRegion || "asia-northeast1";
      
      // Cloud Functions URLを動的に生成
      const functionsUrl = `https://${functionsRegion}-${firebaseConfig.projectId}.cloudfunctions.net`;

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // グローバルに公開
      window.Firebase = { app, auth, db };
      window.FirebaseAuth = { signInWithCustomToken };
      window.FunctionsRegion = functionsRegion;
      window.FunctionsUrl = functionsUrl; // グローバルに公開

      // LIFFとFirebase認証の初期化関数
      window.initLiffAndFirebaseAuth = async function() {
        if (window._debugLog) window._debugLog('2. initLiffAndFirebaseAuth開始');
        if (!window.liff) {
          if (window._debugLog) window._debugLog('2a. window.liffなし', true);
          alert("LIFF SDKが読み込まれていません。");
          return;
        }
        try {
          if (window._debugLog) window._debugLog('2b. liff.init実行中');
          await liff.init({ liffId });
          if (window._debugLog) window._debugLog('2c. liff.init完了');
          if (typeof window.updateInitProgress === 'function') window.updateInitProgress(20);

          if (!liff.isLoggedIn()) {
            if (window._debugLog) window._debugLog('2d. 未ログイン→liff.login()へリダイレクト');
            liff.login();
            return;
          }
          if (window._debugLog) window._debugLog('2e. ログイン済み');

          // ミニアプリ用：profile権限の確認と要求
          try {
            const permissionStatus = await liff.permission.query("profile");
            if (permissionStatus.state === "prompt") {
              await liff.permission.requestAll();
            }
          } catch (permError) {
            console.warn("Permission check not supported or failed:", permError);
            // LIFF環境では権限APIが使えない場合があるため、エラーは無視して続行
          }

          if (window._debugLog) window._debugLog('2f. getIDToken取得中');
          const idToken = await liff.getIDToken();
          if (!idToken) {
            throw new Error("LIFFのIDトークン取得に失敗しました。");
          }
          if (window._debugLog) window._debugLog('2g. getIDToken取得成功');
          if (typeof window.updateInitProgress === 'function') window.updateInitProgress(40);

          // サーバーからFirebaseカスタムトークンを取得
          if (window._debugLog) window._debugLog('2h. getFirebaseCustomToken呼び出し中');
          const res = await fetch(`${functionsUrl}/getFirebaseCustomToken`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${idToken}`,
              "Content-Type": "application/json"
            }
          });

          if (!res.ok) {
            if (window._debugLog) window._debugLog('2h-ERR. getFirebaseCustomToken失敗 status=' + res.status, true);
            throw new Error("Firebaseカスタムトークンの取得に失敗しました。");
          }
          if (window._debugLog) window._debugLog('2i. getFirebaseCustomToken成功');
          if (typeof window.updateInitProgress === 'function') window.updateInitProgress(60);

          const { firebaseToken } = await res.json();
          if (!firebaseToken) {
            throw new Error("サーバーからトークンが返却されませんでした。");
          }

          // Firebase v10 modular SDK対応
          const { auth } = window.Firebase;
          const { signInWithCustomToken } = window.FirebaseAuth;
          const SIGNIN_TIMEOUT_MS = 15000; // 15秒
          const signInStartMs = Date.now();
          if (window._debugLog) window._debugLog('2j. signInWithCustomToken実行中 (token長=' + (firebaseToken?.length || 0) + ' タイムアウト=' + SIGNIN_TIMEOUT_MS + 'ms)');
          const waitIntervalMs = 3000;
          const waitIntervalId = setInterval(() => {
            if (window._debugLog) {
              const elapsed = Math.round((Date.now() - signInStartMs) / 1000);
              window._debugLog('2j-wait. signInWithCustomToken待機中 (' + elapsed + '秒経過)');
            }
          }, waitIntervalMs);
          try {
            await Promise.race([
              signInWithCustomToken(auth, firebaseToken),
              new Promise((_, reject) => setTimeout(() => reject(new Error('処理がタイムアウトしました。再試行して下さい')), SIGNIN_TIMEOUT_MS))
            ]);
            clearInterval(waitIntervalId);
            if (window._debugLog) window._debugLog('2k. signInWithCustomToken正常完了 (所要' + (Date.now() - signInStartMs) + 'ms)');
          } catch (signInErr) {
            clearInterval(waitIntervalId);
            if (window._debugLog) {
              const isTimeout = signInErr?.message === '処理がタイムアウトしました。再試行して下さい';
              window._debugLog((isTimeout ? '2j-TIMEOUT. signInWithCustomToken 15秒タイムアウト' : '2j-ERR. signInWithCustomToken失敗: ') + (signInErr?.message || signInErr), !isTimeout);
            }
            throw signInErr;
          }
          if (window._debugLog) window._debugLog('2k-done. 認証完了');
          if (typeof window.updateInitProgress === 'function') window.updateInitProgress(80);

                // 利用者情報をwindowにセット
      window.LiffFirebase = {
        idToken,
        user: auth.currentUser
      };
      
      // デバッグ表示を更新
      updateDebugDisplay();
    } catch (e) {
      if (window._debugLog) window._debugLog('2-ERR. 認証エラー: ' + (e?.message || e), true);
      console.error("LIFF認証エラー:", e);
      throw e; // 呼び出し側でshowErrorWithRetry・再試行を処理するため再スロー
    }
  };
  
  // デバッグ表示更新関数
  function updateDebugDisplay() {
    const config = window.__CONFIG__;
    if (config) {
      document.getElementById('debug-liff-id').textContent = config.liffId;
      document.getElementById('debug-project-id').textContent = config.firebaseConfig.projectId;
      document.getElementById('debug-store-name').textContent = config.storeInfo.name;
    }
  }
  
  // 長押しでデバッグ表示切り替え（スマホ用）
  let longPressTimer;
  document.addEventListener('touchstart', function(e) {
    longPressTimer = setTimeout(() => {
      const debugEl = document.getElementById('debug-config');
      debugEl.style.display = debugEl.style.display === 'none' ? 'block' : 'none';
    }, 3000); // 3秒長押し
  });
  
  document.addEventListener('touchend', function() {
    clearTimeout(longPressTimer);
  });
    </script>

<!-- ========== DEBUG OVERLAY START ==========
  config.js の DEBUG_SHOW_LIFF_PROCESS で表示可否を切り替え。
  詳細: docs/LINEミニアプリ、LIFF/LINEミニアプリ、LIFF処理表示.md -->
<div id="debug-overlay" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:rgba(0,0,0,0.95);color:#fff;font-size:12px;padding:10px;max-height:50vh;overflow-y:auto;font-family:monospace;display:none;">
  <strong>【デバッグ】ユーザーLIFF処理内容表示（時:分:秒形式）</strong>
  <div id="debug-log"></div>
</div>
<script>
  (function() {
    var show = window.__CONFIG__ && window.__CONFIG__.DEBUG_SHOW_LIFF_PROCESS;
    if (!show) {
      window._debugLog = function() {};
      return;
    }
    var overlay = document.getElementById('debug-overlay');
    if (overlay) overlay.style.display = 'block';
    window._debugLog = function(msg, isError) {
      try {
        var el = document.getElementById('debug-log');
        if (!el) return;
        var d = new Date();
        var timeStr = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
        var line = document.createElement('div');
        line.style.color = (isError ? '#ff6b6b' : '#fff');
        line.textContent = '[' + timeStr + '] ' + msg;
        el.appendChild(line);
        el.parentElement.scrollTop = el.parentElement.scrollHeight;
      } catch (e) {}
    };
    window._debugLog('1. ページHTML解析完了');
  })();
</script>

          <div class="calendar-controls" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">

            <div id="tournament-calendar" class="tournament-calendar calendar-grid flexible-container-flex"></div>
          </div>
          <div id="selected-date-tournaments" class="selected-date-tournaments" style="display: none; margin-top: 20px;">

      <!-- プロフィール画面 -->
      <div id="profile-page" class="page profile-page" style="display: none;">
        <h1>プロフィール</h1>
        <div id="profile-info" class="profile-info">
          <div class="spinner"></div>
        </div>
        <div class="profile-actions">
          <button class="btn" onclick="showHomePage()">ホームに戻る</button>
        </div>
      </div>

      <!-- エラー表示 -->
      <div id="error-message" class="error" style="display: none;"></div>
    </div>
    
    <!-- カートを見るボタン（画面下部固定） - .containerの外側に配置 -->
    <div id="view-cart-btn-container" class="view-cart-btn-container" style="display: none;">
      <button class="btn view-cart-btn" onclick="openCartModal()">
        🛒 カートを見る (<span id="cart-badge-count">0</span>)
      </button>
    </div>

    <script type="module">
      // ページ要素の取得
      const loadingEl = document.getElementById('loading');
      const homePageEl = document.getElementById('home-page');
      const registrationPageEl = document.getElementById('registration-page');
      const qrPageEl = document.getElementById('qr-page');
      const orderPageEl = document.getElementById('order-page');
      const orderHistoryPageEl = document.getElementById('order-history-page');
      const tournamentPageEl = document.getElementById('tournament-page');
      const profilePageEl = document.getElementById('profile-page');
      const errorEl = document.getElementById('error-message');
      const userInfoEl = document.getElementById('user-info');
      const registrationFormEl = document.getElementById('registration-form');
      const progressFillEl = document.getElementById('progress-fill');
      window.updateInitProgress = (percent) => { if (progressFillEl) progressFillEl.style.width = Math.min(100, Math.max(0, percent)) + '%'; };

      // カレンダー用の変数
      let calendarCurrentMonth = new Date();
      let calendarSelectedDateStr = null;
      let calendarClickEventsBound = false;
      let allTournamentsData = [];

      // ページ読み込み完了時の初期化処理
      document.addEventListener('DOMContentLoaded', function() {
        // 注文・トーナメントボタンを確実に非表示にする
        const orderBtn = document.getElementById('order-btn');
        const tournamentBtn = document.getElementById('tournament-btn');
        if (orderBtn) orderBtn.style.display = 'none';
        if (tournamentBtn) tournamentBtn.style.display = 'none';
      });

      // === ローディング制御用の共通関数 ===
      
      // グローバルローディングオーバーレイ表示
      function showGlobalLoading(message = '処理中...') {
        const overlay = document.getElementById('global-loading-overlay');
        if (!overlay) return;
        const msgEl = overlay.querySelector('.global-loading-message');
        if (msgEl) msgEl.textContent = message;
        overlay.style.display = 'flex';
      }
      
      // グローバルローディングオーバーレイ非表示
      function hideGlobalLoading() {
        const overlay = document.getElementById('global-loading-overlay');
        if (overlay) overlay.style.display = 'none';
      }

      function setQrSectionBusy(busy) {
        const container = document.querySelector('#qr-page .qr-container');
        if (!container) return;
        container.classList.add('busy-overlay-host');
        let ov = container.querySelector(':scope > .section-busy-overlay');
        if (!ov) {
          ov = document.createElement('div');
          ov.className = 'section-busy-overlay';
          ov.innerHTML = '<div class="spinner"></div>';
          container.appendChild(ov);
        }
        ov.classList.toggle('is-visible', !!busy);
        document.querySelectorAll('#qr-page .qr-actions .btn').forEach((b) => {
          b.disabled = !!busy;
        });
      }

      function setCartModalOrderBusy(busy, message = '注文送信中…') {
        const mc = document.querySelector('#cart-modal .cart-modal-content');
        if (!mc) return;
        let ov = mc.querySelector(':scope > .section-busy-overlay');
        if (!ov) {
          ov = document.createElement('div');
          mc.appendChild(ov);
        }
        if (!ov.classList.contains('section-busy-overlay--dim-card')) {
          ov.className = 'section-busy-overlay section-busy-overlay--dim-card';
          ov.innerHTML =
            '<div class="section-busy-card"><div class="spinner"></div><p class="section-busy-message"></p></div>';
        }
        if (busy) {
          const msgEl = ov.querySelector('.section-busy-message');
          if (msgEl) msgEl.textContent = message;
        }
        ov.classList.toggle('is-visible', !!busy);
        const closeBtn = document.querySelector('#cart-modal .modal-close-btn');
        if (closeBtn) closeBtn.disabled = !!busy;
        orderPageEl.classList.toggle('order-flow-busy', !!busy);
      }

      function setMenuItemsOrderBusy(busy) {
        const mi = document.getElementById('menu-items');
        if (!mi) return;
        mi.classList.add('busy-overlay-host');
        let ov = document.getElementById('menu-items-busy-overlay');
        if (!ov) {
          ov = document.createElement('div');
          ov.id = 'menu-items-busy-overlay';
          mi.appendChild(ov);
        }
        if (!ov.classList.contains('section-busy-overlay--dim-card')) {
          ov.className = 'section-busy-overlay section-busy-overlay--dim-card';
          ov.innerHTML =
            '<div class="section-busy-card"><div class="spinner"></div><p class="section-busy-message">注文送信中…</p></div>';
        }
        ov.classList.toggle('is-visible', !!busy);
        orderPageEl.classList.toggle('order-flow-busy', !!busy);
      }
      
      // ボタン付き処理のローディング制御
      async function executeWithButtonLoading(asyncFunction, button, loadingText = '処理中...') {
        if (!button) {
          throw new Error('Button element is required');
        }
        
        const originalText = button.textContent;
        const originalDisabled = button.disabled;
        
        try {
          button.disabled = true;
          button.textContent = loadingText;
          
          const result = await asyncFunction();
          return result;
          
        } catch (error) {
          throw error;
        } finally {
          button.disabled = originalDisabled;
          button.textContent = originalText;
        }
      }
      
      // グローバルローディング付き処理の実行
      async function executeWithGlobalLoading(asyncFunction, message = '処理中...') {
        try {
          showGlobalLoading(message);
          const result = await asyncFunction();
          return result;
        } catch (error) {
          throw error;
        } finally {
          hideGlobalLoading();
        }
      }

      // エラー表示関数
      function showError(message) {
        errorEl.textContent = message;
        errorEl.style.display = 'block';
        loadingEl.style.display = 'none';
      }

      const INIT_TIMEOUT_MS = 15000;       // 15秒
      const INIT_SLOW_WARN_MS = 5000;      // 5秒
      const TIMEOUT_MESSAGE = '処理がタイムアウトしました。再試行して下さい';
      const SLOW_WARN_MESSAGE = '処理に時間がかかっています....';

      // エラー表示＋再試行ボタン（タイムアウト・初期化失敗時）
      function showErrorWithRetry(message, error, onRetry) {
        let text = message;
        if (error) text += '\n\n詳細: ' + (error?.message || String(error));
        errorEl.innerHTML = '';
        errorEl.appendChild(document.createTextNode(text));
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn primary-btn';
        btn.textContent = '再試行';
        btn.style.marginTop = '15px';
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (typeof onRetry === 'function') onRetry();
        });
        errorEl.appendChild(btn);
        errorEl.style.display = 'block';
        errorEl.style.whiteSpace = 'pre-wrap';
        loadingEl.style.display = 'none';
      }

      // ページ表示関数
      function showPage(pageElement) {
        loadingEl.style.display = 'none';
        
        // 全てのページを明示的に非表示
        homePageEl.style.display = 'none';
        registrationPageEl.style.display = 'none';
        qrPageEl.style.display = 'none';
        orderPageEl.style.display = 'none';
        orderHistoryPageEl.style.display = 'none';
        tournamentPageEl.classList.remove('active');
        profilePageEl.style.display = 'none';
        
        // 全てのページのactiveクラスを確実に削除
        homePageEl.classList.remove('active');
        registrationPageEl.classList.remove('active');
        qrPageEl.classList.remove('active');
        orderPageEl.classList.remove('active');
        orderHistoryPageEl.classList.remove('active');
        tournamentPageEl.classList.remove('active');
        profilePageEl.classList.remove('active');
        
        // カートボタンの表示制御：注文ページのみ表示（カートが空でない場合）
        const viewCartBtnContainer = document.getElementById('view-cart-btn-container');
        if (pageElement === orderPageEl) {
          // 注文ページの場合、カートに商品があれば表示（updateCartDisplayが制御）
          // ここでは何もしない（updateCartDisplayに任せる）
        } else {
          // 注文ページ以外では常に非表示
          if (viewCartBtnContainer) {
            viewCartBtnContainer.style.display = 'none';
          }
        }
        
        // 対象ページのみ表示してactiveクラスを追加
        pageElement.style.display = 'block';
        pageElement.classList.add('active');
      }

      // URLハッシュナビゲーション処理
      async function handleHashNavigation() {
        const hash = window.location.hash;
        
        // ハッシュに応じてページ遷移
        if (hash === '#qr') {
          await showQRCode();
        } else if (hash === '#order') {
          await showOrderPage();
        } else if (hash === '#history') {
          window.showOrderHistory();
        } else if (hash === '#tournament') {
          window.showTournament();
        } else if (hash === '#profile') {
          window.showProfilePage();
        } else {
          // ハッシュがない場合はホームページを表示
          showPage(homePageEl);
        }
      }

      // store登録確認関数
      async function checkStoreRegistration() {
        if (window._debugLog) window._debugLog('4. checkStoreRegistration開始');
        try {
          const { db } = window.Firebase;
          // LiffFirebaseが存在するかチェック
          if (!window.LiffFirebase || !window.LiffFirebase.user) {
            throw new Error('認証が完了していません。再度ログインしてください。');
          }
          
          const { user } = window.LiffFirebase;

          // Firestoreでユーザー情報を確認
          const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          const userDocRef = doc(db, 'users', user.uid);
          
          const userDoc = await getDoc(userDocRef);
          
          if (userDoc.exists()) {
            if (window._debugLog) window._debugLog('4a. ユーザー登録済み');
            // 登録済みの場合
            const userData = userDoc.data();
            
            // データの存在確認と安全なアクセス
            const pokerName = userData?.pokerName || '未設定';
            const pointA = userData?.pointA || 0;
            const pointB = userData?.pointB || 0;
            const sideGameChip = userData?.sideGameChip || 0;
            
            // 入店状態は getUserStatus（activeStays 参照）で取得するため、初期表示は未入店として表示し updateCheckinStatusUI で更新
            const isStaying = false;
            
            // 入店状態スイッチのスタイル
            // 入店中の場合：深緑バッジ、未入店の場合：灰色テキスト
            const stayingStyle = isStaying 
              ? 'background-color: #1B5E20; color: white; font-weight: bold; padding: 6px 12px; border-radius: 12px; font-size: 1.2em; display: inline-block;'
              : 'color: #999; font-size: 1.5em;';
            const notStayingStyle = !isStaying 
              ? 'color: red; font-weight: bold; font-size: 1.5em;'
              : 'color: #999; font-size: 1.5em;';
            
            // 補足文の内容
            const descriptionText = isStaying 
              ? '※トーナメント参加や注文等が可能です。'
              : '※入店することでトーナメント参加や注文等が可能です。';
            
            userInfoEl.innerHTML = `
              <p style="font-weight: bold; font-size: 1.5rem; margin-bottom: 15px; color: black; margin-top: 25px;">pokerName: ${pokerName}</p>
              <div style="display: flex; gap: 10px; margin-top: 20px; align-items: center; justify-content: center;">
                <span id="status-staying" style="${stayingStyle}">入店中</span>
                <span style="color: #999;">|</span>
                <span id="status-not-staying" style="${notStayingStyle}">未入店</span>
              </div>
              <p id="status-description" style="margin-top: 8px; font-size: 0.9rem; color: #666; background: transparent; border: none; box-shadow: none; padding: 0; text-align: center;">${descriptionText}</p>
            `;
            
                      // ホームページに遷移した際の処理
            // 注文・トーナメントボタンを確実に非表示にする
            const orderBtn = document.getElementById('order-btn');
            const tournamentBtn = document.getElementById('tournament-btn');
            if (orderBtn) orderBtn.style.display = 'none';
            if (tournamentBtn) tournamentBtn.style.display = 'none';
            
            // 入店状態を初期表示時に更新
            await updateCheckinStatusUI(user.uid);
            
            // 入店状態を定期的に更新（永続化のため）
            setInterval(() => {
              updateCheckinStatusUI(user.uid);
            }, 30000); // 30秒ごとに更新
            
            // URLハッシュをチェックして適切なページに遷移
            try {
              handleHashNavigation();
            } catch (error) {
              // ハッシュナビゲーションでエラーが発生した場合はホームページを表示
              showPage(homePageEl);
            }
          } else {
            if (window._debugLog) window._debugLog('4d. ユーザー未登録→登録ページ表示');
            // 未登録の場合
            showPage(registrationPageEl);
          }
        } catch (error) {
          if (window._debugLog) window._debugLog('4-ERR. checkStoreRegistrationエラー: ' + (error?.message || error), true);
          showError('ユーザー情報の確認に失敗しました: ' + error.message);
        }
      }

      // 登録フォーム処理
      registrationFormEl.addEventListener('submit', async (e) => {
        e.preventDefault();

        const controls = registrationFormEl.querySelectorAll('input, select, button');

        const runRegistration = async () => {
          const pokerName = document.getElementById('pokerName').value;
          const email = document.getElementById('email').value;
          const pin = document.getElementById('pin').value;
          const birthMonth = document.getElementById('birthMonth').value;
          const birthDay = document.getElementById('birthDay').value;

          if (!window.LiffFirebase || !window.LiffFirebase.user) {
            throw new Error('認証が完了していません。再度ログインしてください。');
          }

          const { user } = window.LiffFirebase;

          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");
          const createUserAccount = httpsCallable(functions, 'createUserAccount');

          const result = await createUserAccount({
            pokerName: pokerName,
            email: email,
            pin: pin,
            birthMonth: birthMonth,
            birthDay: birthDay
          });

          if (result.data.success) {
            if (result.data.alreadyRegistered) {
              alert('このアカウントは既に登録済みです。');
            } else {
              alert('ユーザー登録成功:\nUID: ' + result.data.uid +
                    '\nQRコード: ' + (result.data.qrCode ? 'Base64生成済み' : 'Base64なし') +
                    '\nStorage URL: ' + (result.data.qrCodeUrl ? '生成済み' : 'なし') +
                    '\n有効期限: ' + (result.data.expiresAt ? new Date(result.data.expiresAt).toLocaleString('ja-JP') : 'なし'));
            }

            const loadingElRegister = document.getElementById('loading');
            if (loadingElRegister) {
              loadingElRegister.style.display = 'block';
            }

            checkStoreRegistration();
          } else {
            throw new Error('ユーザー登録に失敗しました。');
          }
        };

        controls.forEach((el) => {
          el.disabled = true;
        });

        try {
          await executeWithGlobalLoading(runRegistration, '登録処理中…');
        } catch (error) {

          let errorMessage = '登録に失敗しました。';

          if (error.message) {
            if (error.message.includes('pokerName') && error.message.includes('既に使用されています')) {
              errorMessage = 'このpokerNameは既に使用されています。別のpokerNameに変更してください。';
            } else if (error.message.includes('PIN') && error.message.includes('4桁')) {
              errorMessage = 'PINは4桁の数字で入力してください。';
            } else if (error.message.includes('入力情報が不足')) {
              errorMessage = '入力情報が不足しています。全ての項目を入力してください。';
            } else if (error.message.includes('認証が必要')) {
              errorMessage = '認証が必要です。再度ログインしてください。';
            } else if (error.message.includes('ユーザーアカウントの作成に失敗')) {
              errorMessage = 'ユーザーアカウントの作成に失敗しました。しばらく時間をおいて再度お試しください。';
            } else if (error.message.includes('INTERNAL')) {
              errorMessage = 'サーバーエラーが発生しました。しばらく時間をおいて再度お試しください。';
            } else if (error.message.includes('UNAUTHENTICATED')) {
              errorMessage = '認証に失敗しました。再度ログインしてください。';
            } else if (error.message.includes('INVALID_ARGUMENT')) {
              errorMessage = '入力内容に問題があります。入力内容を確認してください。';
            } else if (error.message.includes('ALREADY_EXISTS')) {
              errorMessage = 'このpokerNameは既に使用されています。別のpokerNameに変更してください。';
            } else {
              errorMessage = '登録に失敗しました。入力内容を確認して再度お試しください。';
            }
          }

          alert(errorMessage);
        } finally {
          controls.forEach((el) => {
            el.disabled = false;
          });
        }
      });

      // 入店状態に応じてUIを更新する関数
      async function updateCheckinStatusUI(userId) {
        try {
          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");
          const getUserStatus = httpsCallable(functions, 'getUserStatus');
          
          const result = await getUserStatus({ uid: userId });
          
          if (result.data.success) {
            const userData = result.data.user;
            const isStaying = userData.isStaying;
            
            // 入店状態スイッチの更新
            const statusStayingEl = document.getElementById('status-staying');
            const statusNotStayingEl = document.getElementById('status-not-staying');
            const statusDescriptionEl = document.getElementById('status-description');
            
            if (statusStayingEl && statusNotStayingEl) {
              if (isStaying) {
                // 入店中の場合：深緑バッジ、「未入店」を灰色
                statusStayingEl.style.backgroundColor = '#1B5E20';
                statusStayingEl.style.color = 'white';
                statusStayingEl.style.fontWeight = 'bold';
                statusStayingEl.style.padding = '6px 12px';
                statusStayingEl.style.borderRadius = '12px';
                statusStayingEl.style.fontSize = '1.2em';
                statusStayingEl.style.display = 'inline-block';
                statusNotStayingEl.style.color = '#999';
                statusNotStayingEl.style.fontWeight = 'normal';
                statusNotStayingEl.style.fontSize = '1.5em';
                statusNotStayingEl.style.backgroundColor = 'transparent';
                statusNotStayingEl.style.padding = '0';
                statusNotStayingEl.style.borderRadius = '0';
                
                // 補足文を表示
                if (statusDescriptionEl) {
                  statusDescriptionEl.textContent = '※トーナメント参加や注文等が可能です。';
                  statusDescriptionEl.style.display = 'block';
                  statusDescriptionEl.style.background = 'transparent';
                  statusDescriptionEl.style.border = 'none';
                  statusDescriptionEl.style.boxShadow = 'none';
                  statusDescriptionEl.style.padding = '0';
                }
              } else {
                // 未入店の場合：「未入店」を赤、「入店中」を灰色
                statusStayingEl.style.color = '#999';
                statusStayingEl.style.fontWeight = 'normal';
                statusStayingEl.style.fontSize = '1.5em';
                statusStayingEl.style.backgroundColor = 'transparent';
                statusStayingEl.style.padding = '0';
                statusStayingEl.style.borderRadius = '0';
                statusNotStayingEl.style.color = 'red';
                statusNotStayingEl.style.fontWeight = 'bold';
                statusNotStayingEl.style.fontSize = '1.5em';
                statusNotStayingEl.style.backgroundColor = 'transparent';
                statusNotStayingEl.style.padding = '0';
                statusNotStayingEl.style.borderRadius = '0';
                
                // 補足文を表示
                if (statusDescriptionEl) {
                  statusDescriptionEl.textContent = '※入店することでトーナメント参加や注文等が可能です。';
                  statusDescriptionEl.style.display = 'block';
                  statusDescriptionEl.style.background = 'transparent';
                  statusDescriptionEl.style.border = 'none';
                  statusDescriptionEl.style.boxShadow = 'none';
                  statusDescriptionEl.style.padding = '0';
                }
              }
            }
            
            // 注文・トーナメントボタンの表示制御
            const orderBtn = document.getElementById('order-btn');
            const tournamentBtn = document.getElementById('tournament-btn');
            
            if (isStaying) {
              if (orderBtn) orderBtn.style.display = 'block';
            } else {
              if (orderBtn) orderBtn.style.display = 'none';
            }
            if (tournamentBtn) tournamentBtn.style.display = 'block';
            window.userStayingStatus = isStaying;
            
          } else {
          }
        } catch (error) {
        }
      }

      // ページ遷移関数
      window.showHomePage = () => showPage(homePageEl);
      window.showQRPage = () => showPage(qrPageEl);
      window.showOrderPage = async () => {
        showPage(orderPageEl);
        
        // カテゴリー情報とメニューデータを動的に取得
        const menuData = await loadCategoriesAndMenuData();
        
        if (menuData && menuData.categories.length > 0) {
          // デフォルトで最初のカテゴリを表示
          const defaultCategory = menuData.categories[0];
          loadMenuItems(defaultCategory, menuData.allMenuItems);
        }
        
        // カートに商品がある場合、カートボタンを表示
        updateCartDisplay();
      };
      window.showOrderHistory = () => {
        showPage(orderHistoryPageEl);
        loadOrderHistory();
      };
      window.showProfilePage = () => showPage(profilePageEl);

      // QRコード関連関数
      window.showQRCode = async () => {
        try {
          showPage(qrPageEl);
          await displayStoredQRCode();
        } catch (error) {
          showError('QRコードの表示に失敗しました: ' + error.message);
        }
      };

      window.generateNewQR = async () => {
        try {
          setQrSectionBusy(true);
          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");
          const generateQRCode = httpsCallable(functions, 'generateQRCode');

          const result = await generateQRCode({ type: 'user' });

          if (result.data.qrCode) {
            await displayStoredQRCode();
          } else {
            throw new Error('QRコードの生成に失敗しました');
          }
        } catch (error) {
          showError('QRコードの生成に失敗しました: ' + error.message);
        } finally {
          setQrSectionBusy(false);
        }
      };

      // QRコード表示関数（Storageから取得）
      async function displayStoredQRCode() {
        const qrDisplay = document.getElementById('qr-code-display');
        const expiryTime = document.getElementById('qr-expiry-time');
        
        qrDisplay.innerHTML = '<div class="spinner"></div>';
        
        try {
          // Firebase認証の状態を確認
          const { auth } = window.Firebase;
          const currentUser = auth.currentUser;
          
          if (!currentUser) {
            qrDisplay.innerHTML = '<p>認証が完了していません</p>';
            return;
          }
          
          // ユーザーデータからQRコードURLを取得（更新直後は必ずサーバーから取得）
          const { db } = window.Firebase;
          const { doc, getDoc, getDocFromServer } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          
          // QRコード更新直後は必ずサーバーから取得（キャッシュを避ける）
          const userDoc = await getDocFromServer(doc(db, 'users', currentUser.uid));
          
          if (userDoc.exists()) {
            const userData = userDoc.data();
            
            if (userData.qrCodeUrl && userData.qrExpiresAt) {
              const now = new Date();
              const expiryDate = userData.qrExpiresAt.toDate();
              const isExpired = now > expiryDate;
              
              if (isExpired) {
                qrDisplay.innerHTML = '<p>QRコードを生成中...</p>';
                await generateNewQRCode();
                return;
              }
              
              qrDisplay.innerHTML = `<img src="${userData.qrCodeUrl}" alt="QR Code" style="max-width: 300px; width: 100%;">`;
              
              expiryTime.textContent = expiryDate.toLocaleString('ja-JP');
            } else {
              qrDisplay.innerHTML = '<p>QRコードを生成中...</p>';
              await generateNewQRCode();
            }
          } else {
            qrDisplay.innerHTML = '<p>ユーザー情報が見つかりません</p>';
            expiryTime.textContent = '有効期限: -';
          }
        } catch (error) {
          qrDisplay.innerHTML = '<p>QRコードの読み込みに失敗しました</p>';
          expiryTime.textContent = '有効期限: -';
        }
      }

      // QR再生成の無限ループ防止用
      let regenInFlight = false;
      let lastRegenAtMs = 0;

      // 新しいQRコード生成関数（内部用）- 60秒ルール適用
      async function generateNewQRCode() {
        const now = Date.now();
        const qrDisplay = document.getElementById('qr-code-display');
        
        // 再生成中フラグチェック
        if (regenInFlight) {
          qrDisplay.innerHTML = '<p>QRコードを生成中...</p>';
          return;
        }
        
        // 60秒クールダウンチェック
        if (lastRegenAtMs > 0 && now - lastRegenAtMs < 60000) {
          const remainingSec = Math.ceil((60000 - (now - lastRegenAtMs)) / 1000);
          qrDisplay.innerHTML = '<p>QRコードは60秒間隔で再生成できます。<br>あと' + remainingSec + '秒お待ちください。</p>';
          return;
        }
        
        regenInFlight = true;
        lastRegenAtMs = now;
        qrDisplay.innerHTML = '<div class="spinner"></div>';

        try {
          setQrSectionBusy(true);
          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");
          const generateQRCode = httpsCallable(functions, 'generateQRCode');

          const result = await generateQRCode({ type: 'user' });

          if (result.data.qrCode) {
            await displayStoredQRCode();
          } else {
            throw new Error('QRコードの生成に失敗しました');
          }
        } catch (error) {
          qrDisplay.innerHTML = '<p>QRコードの生成に失敗しました</p>';
          throw error;
        } finally {
          setQrSectionBusy(false);
          regenInFlight = false;
        }
      }

      // 注文メニュー関連関数

      // カテゴリー情報とメニューデータを動的に取得・表示
      async function loadCategoriesAndMenuData() {
        try {
          // Firebase Functions SDKを使用してCallable Functionを呼び出し
          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");
          const getMenuItems = httpsCallable(functions, 'getMenuItems');
          
          const result = await getMenuItems({});
          
          if (!result.data || !result.data.success) {
            throw new Error(result.data?.error || 'カテゴリー情報の取得に失敗しました');
          }

          const allMenuItems = result.data.data || [];
          
          // ユニークなカテゴリーを抽出（Chipカテゴリーは除外）
          const categories = [...new Set(allMenuItems.map(item => item.category))].filter(cat => cat && cat !== 'Chip');
          
          // カテゴリーボタンを動的に生成
          const categoryContainer = document.querySelector('.menu-categories');
          if (categoryContainer) {
            categoryContainer.innerHTML = categories.map((category, index) => `
              <button class="category-btn ${index === 0 ? 'active' : ''}" onclick="showCategory('${category}', this)">
                ${getCategoryDisplayName(category)}
              </button>
            `).join('');
          }

          // メニューデータをグローバルにキャッシュ
          window.cachedMenuData = allMenuItems;
          
          // メニューデータを返す
          return { categories, allMenuItems };

        } catch (error) {
          // エラー時はデフォルトカテゴリーを使用
          return null;
        }
      }

      // カテゴリー表示名を取得
      function getCategoryDisplayName(category) {
        // Chipカテゴリーは非表示にする
        if (category === 'Chip') {
          return null;
        }
        
        const categoryNames = {
          'food': '食事',
          'drink': 'ドリンク',
          'dessert': 'デザート',
          'alcohol': 'アルコール',
          'snack': 'スナック'
        };
        return categoryNames[category] || category;
      }

      window.showCategory = (category, buttonElement) => {
        // カテゴリボタンのアクティブ状態を更新
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        buttonElement.classList.add('active');
        
        // キャッシュされたメニューデータがある場合は使用
        const cachedData = window.cachedMenuData;
        loadMenuItems(category, cachedData);
      };

      async function loadMenuItems(category, cachedMenuItems = null) {
        const menuItems = document.getElementById('menu-items');
        
        try {
          let allMenuItems;
          
          if (cachedMenuItems) {
            // キャッシュされたメニューデータを使用
            allMenuItems = cachedMenuItems;
          } else {
            // キャッシュがない場合は新しく取得
            menuItems.innerHTML = '<div class="spinner"></div>';
            try {
            const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
            const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");
            const getMenuItems = httpsCallable(functions, 'getMenuItems');
            
            const result = await getMenuItems({});
            
            if (!result.data || !result.data.success) {
              throw new Error(result.data?.error || 'メニューの取得に失敗しました');
            }

            allMenuItems = result.data.data || [];
            } catch (error) {
              menuItems.innerHTML = `<p class="error-message">メニューの取得に失敗しました: ${error.message}</p>`;
              return;
            }
          }
          
          // カテゴリーでフィルタリング
          const filteredItems = allMenuItems.filter(item => 
            item.category === category && 
            !item.isArchive && 
            !item.isSoldOut
          );

          if (filteredItems.length === 0) {
            menuItems.innerHTML = '<p>このカテゴリーにはメニューがありません</p>';
            return;
          }

          // メニューアイテムを表示
          menuItems.innerHTML = filteredItems.map(item => `
            <div class="menu-item">
              <div class="menu-item-image">
                ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.name}" onerror="this.style.display='none'">` : ''}
              </div>
              <div class="menu-item-content">
                <h3>${item.name}</h3>
                <p class="description">${item.description || ''}</p>
                <p class="price">¥${item.price}</p>
                <div class="quantity-selector">
                  <button class="btn-quantity" onclick="changeQuantity('${item.id}', -1)">-</button>
                  <span id="quantity-${item.id}">1</span>
                  <button class="btn-quantity" onclick="changeQuantity('${item.id}', 1)">+</button>
                </div>
                <button class="btn add-to-cart-btn" onclick="addToCart('${item.id}', '${item.name}', ${item.price}, '${item.category}')">
                  🛒 カートに追加
                </button>
              </div>
            </div>
          `).join('');

        } catch (error) {
          menuItems.innerHTML = `<p>メニューの読み込みに失敗しました: ${error.message}</p>`;
        }
      }

      // カート管理用のグローバル変数
      let cart = [];
      
      // 数量変更機能
      window.changeQuantity = (itemId, change) => {
        const quantityElement = document.getElementById(`quantity-${itemId}`);
        if (quantityElement) {
          let currentQuantity = parseInt(quantityElement.textContent) || 1;
          currentQuantity = Math.max(1, currentQuantity + change); // 最小値は1
          quantityElement.textContent = currentQuantity;
        }
      };
      
      // カートにアイテムを追加
      window.addToCart = (itemId, itemName, price, category) => {
        const quantityElement = document.getElementById(`quantity-${itemId}`);
        const quantity = parseInt(quantityElement?.textContent) || 1;
        
        // 既存のアイテムがあるかチェック
        const existingItemIndex = cart.findIndex(item => item.menuItemId === itemId);
        
        if (existingItemIndex !== -1) {
          // 既存アイテムの数量を更新
          cart[existingItemIndex].quantity += quantity;
        } else {
          // 新しいアイテムを追加
          cart.push({
            menuItemId: itemId,
            name: itemName,
            price: price,
            category: category,
            quantity: quantity
          });
        }
        
        // 数量をリセット
        if (quantityElement) {
          quantityElement.textContent = '1';
        }
        
        // カート表示を更新
        updateCartDisplay();
        
        // 成功メッセージ（控えめに）
        // alert(`${itemName} × ${quantity}個をカートに追加しました！`);
      };
      
      // カート表示を更新
      function updateCartDisplay() {
        const cartItemsEl = document.getElementById('cart-items');
        const cartItemCountEl = document.getElementById('cart-item-count');
        const cartBadgeCountEl = document.getElementById('cart-badge-count');
        const cartTotalPriceEl = document.getElementById('cart-total-price');
        const orderAllBtn = document.getElementById('order-all-btn');
        const viewCartBtnContainer = document.getElementById('view-cart-btn-container');
        
        if (cart.length === 0) {
          cartItemsEl.innerHTML = '<p class="empty-cart">カートは空です</p>';
          cartItemCountEl.textContent = '0';
          cartBadgeCountEl.textContent = '0';
          cartTotalPriceEl.textContent = '0';
          orderAllBtn.disabled = true;
          viewCartBtnContainer.style.display = 'none';
          return;
        }
        
        // カートアイテムを表示
        cartItemsEl.innerHTML = cart.map((item, index) => `
          <div class="cart-item">
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <p class="cart-item-category">${getCategoryDisplayName(item.category)}</p>
              <p class="cart-item-price">¥${item.price} × ${item.quantity}個</p>
            </div>
            <div class="cart-item-actions">
              <button class="btn-quantity" onclick="updateCartItemQuantity(${index}, -1)">-</button>
              <span class="cart-item-quantity">${item.quantity}</span>
              <button class="btn-quantity" onclick="updateCartItemQuantity(${index}, 1)">+</button>
              <button class="btn remove-btn" onclick="removeFromCart(${index})">削除</button>
            </div>
          </div>
        `).join('');
        
        // 合計金額を計算
        const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        
        cartItemCountEl.textContent = totalItems;
        cartBadgeCountEl.textContent = totalItems;
        cartTotalPriceEl.textContent = totalPrice.toLocaleString();
        orderAllBtn.disabled = false;
        
        // カートボタンは注文ページでのみ表示
        if (orderPageEl.style.display === 'block' || orderPageEl.classList.contains('active')) {
          viewCartBtnContainer.style.display = 'block';
        } else {
          viewCartBtnContainer.style.display = 'none';
        }
      }
      
      // カートモーダルを開く
      window.openCartModal = () => {
        document.getElementById('cart-modal').style.display = 'flex';
      };
      
      // カートモーダルを閉じる
      window.closeCartModal = () => {
        document.getElementById('cart-modal').style.display = 'none';
      };
      
      // カートアイテムの数量を更新
      window.updateCartItemQuantity = (index, change) => {
        if (index >= 0 && index < cart.length) {
          cart[index].quantity = Math.max(1, cart[index].quantity + change);
          updateCartDisplay();
        }
      };
      
      // カートからアイテムを削除
      window.removeFromCart = (index) => {
        if (index >= 0 && index < cart.length) {
          const item = cart[index];
          if (confirm(`${item.name}をカートから削除しますか？`)) {
            cart.splice(index, 1);
            updateCartDisplay();
          }
        }
      };
      
      // カートを空にする
      window.clearCart = () => {
        if (cart.length > 0 && confirm('カートを空にしますか？')) {
          cart = [];
          updateCartDisplay();
          closeCartModal();
        }
      };

      window.orderItem = (itemId, itemName, price, category) => {
        const quantityElement = document.getElementById(`quantity-${itemId}`);
        const quantity = parseInt(quantityElement?.textContent) || 1;
        const totalPrice = price * quantity;
        
        // 注文確認ダイアログ
        if (confirm(`${itemName} × ${quantity}個 = ¥${totalPrice}\n\nこの注文を確定しますか？`)) {
          // 注文処理を実行
          processOrder(itemId, itemName, price, quantity, totalPrice, category);
        }
      };

      // 全てのアイテムを一括注文
      window.orderAllItems = async () => {
        if (cart.length === 0) {
          alert('カートが空です');
          return;
        }

        const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

        if (!confirm(`合計 ${totalItems}個 (¥${totalPrice.toLocaleString()})\n\nこの注文を確定しますか？`)) {
          return;
        }

        const cartSendingLabel =
          cart.length === 1 && totalItems === 1 ? '注文送信中…' : '一括注文送信中…';

        const orderBtn = document.getElementById('order-all-btn');

        setCartModalOrderBusy(true, cartSendingLabel);
        if (orderBtn) orderBtn.disabled = true;

        try {
          const { auth } = window.Firebase;
          if (!auth.currentUser) {
            alert('認証が必要です。ページを再読み込みしてください。');
            return;
          }

          const userId = auth.currentUser.uid;

          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");
          const getUserStatus = httpsCallable(functions, 'getUserStatus');

          const statusResult = await getUserStatus({ uid: userId });
          if (!statusResult.data.success || !statusResult.data.user.isStaying) {
            alert('入店していません。先に入店してください。');
            return;
          }

          const placeOrderByUser = httpsCallable(functions, 'placeOrderByUser');

          const result = await placeOrderByUser({
            items: cart.map(item => ({
              menuItemId: item.menuItemId,
              category: item.category,
              name: item.name,
              price: item.price,
              quantity: item.quantity
            }))
          });

          if (result.data.success) {
            alert(`🎉 全ての注文が完了しました！\n\n注文数: ${result.data.data.itemsCount}個\n合計金額: ¥${result.data.data.totalItemsPrice.toLocaleString()}`);
            cart = [];
            updateCartDisplay();
            closeCartModal();
            if (orderHistoryPageEl.classList.contains('active')) {
              loadOrderHistory();
            }
          } else {
            throw new Error(result.data.error || '注文に失敗しました');
          }
        } catch (error) {
          console.error('一括注文エラー:', error);
          alert(`注文に失敗しました: ${error.message}`);
          updateCartDisplay();
        } finally {
          setCartModalOrderBusy(false);
          if (orderBtn) orderBtn.disabled = false;
        }
      };
      
      // 注文履歴を読み込む（orders/_TodaysOrders から取得。同一営業日・userId一致。キャンセル以外は通常表示、キャンセルは「キャンセル」表示・合計に含めない）
      async function loadOrderHistory() {
        const historyListEl = document.getElementById('order-history-list');
        const statsEl = document.getElementById('history-stats');
        
        statsEl.style.display = 'none';
        
        try {
          historyListEl.innerHTML = '<div class="spinner"></div>';
          
          const { auth } = window.Firebase;
          if (!auth.currentUser) {
            throw new Error('認証が必要です。ページを再読み込みしてください。');
          }

          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");
          const getUserOrderHistory = httpsCallable(functions, 'getUserOrderHistory');
          const result = await getUserOrderHistory({});
          const payload = result.data;
          if (!payload || payload.success === false) {
            const errMsg = (payload && payload.error) ? payload.error : '注文履歴の取得に失敗しました。';
            historyListEl.innerHTML = `<p class="error-message">${errMsg}</p>`;
            return;
          }
          const data = payload.data || {};
          const orders = data.orders || [];
          const totalAmount = data.totalAmount ?? 0;
          
          if (orders.length === 0) {
            historyListEl.innerHTML = '<p class="empty-history">本日の注文履歴はありません</p>';
            statsEl.style.display = 'flex';
            document.getElementById('total-orders').textContent = '0';
            document.getElementById('total-amount').textContent = '¥0';
            return;
          }
          
          document.getElementById('total-orders').textContent = String(orders.length);
          document.getElementById('total-amount').textContent = `¥${Number(totalAmount).toLocaleString()}`;
          statsEl.style.display = 'flex';
          
          historyListEl.innerHTML = orders.map(order => {
            const items = order.items || [];
            const aggregatedItems = {};
            const cancelItems = [];
            items.forEach(item => {
              const status = item.status || 'preparing';
              if (status === 'cancel') {
                cancelItems.push(item);
              } else {
              const key = `${item.name}_${item.price}`;
              if (aggregatedItems[key]) {
                aggregatedItems[key].quantity += item.quantity;
              } else {
                  aggregatedItems[key] = { name: item.name, quantity: item.quantity, price: item.price ?? 0, status };
                }
              }
            });
            const uniqueItems = Object.values(aggregatedItems);
            const totalCancelQty = cancelItems.reduce((s, i) => s + (i.quantity || 0), 0);
            const totalPrice = order.totalPrice ?? 0;
            
            return `
              <div class="order-history-item">
                <div class="order-header">
                  <div class="order-info">
                    <span class="order-status status-${order.status || 'served'}">${getStatusDisplayName(order.status || 'served')}</span>
                  </div>
                  <div class="order-amount">
                    ¥${totalPrice.toLocaleString()}
                  </div>
                </div>
                <div class="order-items">
                  ${uniqueItems.map(item => `
                    <div class="order-item">
                      <span class="item-name">${item.name}</span>
                      <span class="item-details">${item.quantity}個 × ¥${(item.price || 0).toLocaleString()}</span>
                    </div>
                  `).join('')}
                  ${totalCancelQty > 0 ? `
                    <div class="order-item order-item-cancel">
                      <span class="item-name">キャンセル</span>
                      <span class="item-details">${totalCancelQty > 1 ? totalCancelQty + '件 ' : ''}キャンセル</span>
                </div>
                  ` : ''}
                </div>
                ${order.currentTable ? `<div class="order-location">テーブル: ${order.currentTable}${order.currentSeat != null ? ` (${order.currentSeat})` : ''}</div>` : ''}
              </div>
            `;
          }).join('');
          
        } catch (error) {
          historyListEl.innerHTML = `<p class="error-message">本日の注文履歴の読み込みに失敗しました: ${error.message}</p>`;
        }
      }
      
      // 注文履歴を更新
      window.refreshOrderHistory = () => {
        loadOrderHistory();
      };
      

      
      // ステータス表示名を取得
      function getStatusDisplayName(status) {
        const statusNames = {
          'open': '注文中',
          'closed': '完了',
          'cancelled': 'キャンセル',
          'preparing': '調理中',
          'served': '提供済み'
        };
        return statusNames[status] || status;
      }
      
      // 個別注文処理関数（既存のまま）
      async function processOrder(itemId, itemName, price, quantity, totalPrice, category) {
        try {
          const { auth } = window.Firebase;
          if (!auth.currentUser) {
            alert('認証が必要です。ページを再読み込みしてください。');
            return;
          }

          const userId = auth.currentUser.uid;

          setMenuItemsOrderBusy(true);

          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app, window.FunctionsRegion || "asia-northeast1");

      // フォーマット関数
      function formatDate(timestamp) {
        if (!timestamp) return '日付不明';
        const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return `${date.getMonth() + 1}/${date.getDate()}`;
      }

      function formatDateWithDay(timestamp) {
        if (!timestamp) return '日付不明';
        const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
        const dayOfWeek = weekdays[date.getDay()];
        return `${date.getMonth() + 1}/${date.getDate()} (${dayOfWeek})`;
      }

      function formatTime(timestamp) {
        if (!timestamp) return '時間不明';
        const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
      }

      function formatRegistrationTime(regEndAt, startAt) {
        if (!regEndAt || !startAt) return '不明';
        
        const regEndDate = regEndAt.toDate ? regEndAt.toDate() : new Date(regEndAt);
        const startDate = startAt.toDate ? startAt.toDate() : new Date(startAt);
        
        // レジスト終了時刻をフォーマット
        const regEndTime = `${regEndDate.getHours().toString().padStart(2, '0')}:${regEndDate.getMinutes().toString().padStart(2, '0')}`;
        
        // 開始時刻との差を計算（分単位）
        const diffMs = startDate.getTime() - regEndDate.getTime();
        const diffMinutes = Math.round(diffMs / (1000 * 60));
        
        if (diffMinutes > 0) {
          return `${regEndTime}まで（開始${diffMinutes}分前）`;
        } else if (diffMinutes === 0) {
          return `${regEndTime}（開始時刻と同じ）`;
        } else {
          return `${regEndTime}`;
        }
      }

      // 初期化処理（再試行時は isRetry=true で signOut を先に実行）
      async function runUserInitialization(isRetry = false) {
        if (isRetry) {
          try {
            const { auth } = window.Firebase || {};
            if (auth) await auth.signOut();
          } catch (e) { /* サインアウト失敗は無視 */ }
        }

        if (window._debugLog) window._debugLog(isRetry ? '3-RETRY. 再試行開始（signOut済み）' : '3. DOMContentLoaded発火');
        errorEl.style.display = 'none';
        loadingEl.style.display = 'block';
        const loadingRetryContainer = document.getElementById('loading-retry-container');
        if (loadingRetryContainer) { loadingRetryContainer.innerHTML = ''; loadingRetryContainer.style.display = 'none'; }
        if (typeof window.updateInitProgress === 'function') window.updateInitProgress(0);
        const slowWarnId = setTimeout(() => {
          const retryContainer = document.getElementById('loading-retry-container');
          if (retryContainer) {
            retryContainer.innerHTML = '';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn primary-btn';
            btn.textContent = '再試行';
            btn.onclick = () => { const r = () => location.reload(); const a = window.Firebase?.auth; a ? Promise.race([a.signOut(), new Promise(x => setTimeout(x, 2000))]).then(r).catch(r) : r(); };
            retryContainer.appendChild(btn);
            retryContainer.style.display = 'block';
          }
        }, INIT_SLOW_WARN_MS);
        const timeoutId = setTimeout(() => {
          loadingEl.style.display = 'none';
          showErrorWithRetry(TIMEOUT_MESSAGE, null, () => { const r = () => location.reload(); const a = window.Firebase?.auth; a ? Promise.race([a.signOut(), new Promise(x => setTimeout(x, 2000))]).then(r).catch(r) : r(); });
        }, INIT_TIMEOUT_MS);
        const clearInitTimers = () => { clearTimeout(slowWarnId); clearTimeout(timeoutId); };
          homePageEl.style.display = 'none';
          registrationPageEl.style.display = 'none';
          qrPageEl.style.display = 'none';
          orderPageEl.style.display = 'none';
          orderHistoryPageEl.style.display = 'none';
          tournamentPageEl.style.display = 'none';
          profilePageEl.style.display = 'none';
          
        try {
          if (window._debugLog) window._debugLog('3a. generateBirthdayOptions実行');
          generateBirthdayOptions();
          
          if (window._debugLog) window._debugLog('3b. initLiffAndFirebaseAuth呼び出し');
          try {
          await window.initLiffAndFirebaseAuth();
            if (window._debugLog) window._debugLog('3c. initLiffAndFirebaseAuth完了');
          } catch (liffError) {
            clearInitTimers();
            loadingEl.style.display = 'none';
            const isTimeout = liffError?.message === TIMEOUT_MESSAGE;
            showErrorWithRetry(isTimeout ? TIMEOUT_MESSAGE : 'LIFF初期化に失敗しました', isTimeout ? null : liffError, () => { const r = () => location.reload(); const a = window.Firebase?.auth; a ? Promise.race([a.signOut(), new Promise(x => setTimeout(x, 2000))]).then(r).catch(r) : r(); });
            return;
          }

          if (window._debugLog) window._debugLog('3d. checkStoreRegistration呼び出し');
          try {
          await checkStoreRegistration();
            if (window._debugLog) window._debugLog('3e. checkStoreRegistration完了');
          } catch (checkError) {
            clearInitTimers();
            loadingEl.style.display = 'none';
            showErrorWithRetry('ユーザー登録確認に失敗しました', checkError, () => { const r = () => location.reload(); const a = window.Firebase?.auth; a ? Promise.race([a.signOut(), new Promise(x => setTimeout(x, 2000))]).then(r).catch(r) : r(); });
            return;
          }

          clearInitTimers();
          loadingEl.style.display = 'none';
          errorEl.style.display = 'none';
          if (typeof window.updateInitProgress === 'function') window.updateInitProgress(100);
        } catch (error) {
          clearInitTimers();
          if (window._debugLog) window._debugLog('3-ERR. 初期化エラー: ' + (error?.message || error), true);
          loadingEl.style.display = 'none';
          showErrorWithRetry('初期化に失敗しました', error, () => { const r = () => location.reload(); const a = window.Firebase?.auth; a ? Promise.race([a.signOut(), new Promise(x => setTimeout(x, 2000))]).then(r).catch(r) : r(); });
        }
      }

      /** カレンダー表示の下限: 当月（当月内の過去日付は表示可）。 */
      function isBeforeCurrentCalendarMonth(date) {
        const now = new Date();
        const year = date.getFullYear();
        const month = date.getMonth();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();
        return year < currentYear || (year === currentYear && month < currentMonth);
      }

      function isCurrentCalendarMonth(date) {
        const now = new Date();
        return date.getFullYear() === now.getFullYear()
          && date.getMonth() === now.getMonth();
      }

      function clampCalendarCurrentMonthToMinimum() {
        if (isBeforeCurrentCalendarMonth(calendarCurrentMonth)) {
          const now = new Date();
          calendarCurrentMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        }
      }

      function updateCalendarMonthNavButtons() {
        const prevBtn = document.getElementById('calendar-prev-month-btn');
        if (!prevBtn) return;
        const atMinimum = isCurrentCalendarMonth(calendarCurrentMonth);
        prevBtn.disabled = atMinimum;
        prevBtn.style.opacity = atMinimum ? '0.5' : '1';
        prevBtn.style.cursor = atMinimum ? 'not-allowed' : 'pointer';
      }

      function isJapaneseHoliday(date) {
        try {
          if (typeof window !== 'undefined' &&
              typeof window.JapaneseHolidays !== 'undefined' &&
              window.JapaneseHolidays &&
              typeof window.JapaneseHolidays.isHoliday === 'function') {
            const result = window.JapaneseHolidays.isHoliday(date);
            return result !== undefined && result !== null;
          }
        } catch (error) {
          console.warn('祝日判定ライブラリの呼び出しに失敗:', error);
        }

        const month = date.getMonth() + 1;
        const day = date.getDate();
        const weekday = date.getDay();
        const fixedHolidays = [
          { month: 1, day: 1 },
          { month: 2, day: 11 },
          { month: 2, day: 23 },
          { month: 4, day: 29 },
          { month: 5, day: 3 },
          { month: 5, day: 4 },
          { month: 5, day: 5 },
          { month: 8, day: 11 },
          { month: 11, day: 3 },
          { month: 11, day: 23 },
        ];

        for (const holiday of fixedHolidays) {
          if (holiday.month === month && holiday.day === day) {
            return true;
          }
        }

        if (month === 3 && (day === 20 || day === 21)) return true;
        if (month === 9 && (day === 22 || day === 23)) return true;

        if (month === 7 && weekday === 1) {
          const firstMonday = day - ((day - 1) % 7);
          if (day >= firstMonday + 14 && day < firstMonday + 21) return true;
        }
        if (month === 9 && weekday === 1) {
          const firstMonday = day - ((day - 1) % 7);
          if (day >= firstMonday + 14 && day < firstMonday + 21) return true;
        }
        if (month === 10 && weekday === 1) {
          const firstMonday = day - ((day - 1) % 7);
          if (day >= firstMonday + 7 && day < firstMonday + 14) return true;
        }

        return false;
      }

      function getTournamentCalendarDayColor(currentDate, isToday) {
        const weekday = currentDate.getDay();
        const isHoliday = isJapaneseHoliday(currentDate);
        if (isToday) return '#0000ff';
        if (weekday === 6) return isHoliday ? '#ff0000' : '#0000ff';
        if (weekday === 0 || isHoliday) return '#ff0000';
        return '#000000';
      }

      // トーナメントカレンダーを描画
      function renderTournamentCalendar() {
        const calendar = document.getElementById('tournament-calendar');
        const monthDisplay = document.getElementById('calendar-current-month');
        
        if (!calendar || !monthDisplay) {
          return;
        }

        clampCalendarCurrentMonthToMinimum();
        updateCalendarMonthNavButtons();

        const year = calendarCurrentMonth.getFullYear();
        const month = calendarCurrentMonth.getMonth();
        
        monthDisplay.textContent = `${year}年${month + 1}月`;
        
        // トーナメントを日付ごとにグループ化
        const tournamentsByDate = groupTournamentsByDate(allTournamentsData, year, month);
        
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const firstDayOfMonth = firstDay.getDay();
        const daysInMonth = lastDay.getDate();
        
        let calendarHTML = '<div class="calendar-weekdays" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; width: 100%; max-width: 100%;">';
        const weekdayColors = [
          { day: '日', color: '#ff0000' },
          { day: '月', color: '#000000' },
          { day: '火', color: '#000000' },
          { day: '水', color: '#000000' },
          { day: '木', color: '#000000' },
          { day: '金', color: '#000000' },
          { day: '土', color: '#0000ff' },
        ];
        weekdayColors.forEach(({ day, color }) => {
          calendarHTML += `<div class="weekday" style="min-width: 0; width: 100%; box-sizing: border-box; padding: 4px 2px; text-align: center; font-size: 0.8rem; font-weight: bold; color: ${color};">${day}</div>`;
        });
        calendarHTML += '</div>';
        
        calendarHTML += '<div class="calendar-days" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; width: 100%; max-width: 100%;">';
        
        for (let i = 0; i < firstDayOfMonth; i++) {
          calendarHTML += '<div class="calendar-day empty" style="min-width: 0; width: 100%; box-sizing: border-box; padding: 2px; text-align: center; font-size: 0.9rem;"></div>';
        }
        
        for (let day = 1; day <= daysInMonth; day++) {
          const currentDate = new Date(year, month, day);
          const dateStr = formatTournamentCalendarDateStr(year, month, day);
          const isToday = currentDate.toDateString() === new Date().toDateString();
          const dayColor = getTournamentCalendarDayColor(currentDate, isToday);
          
          const tournamentInfo = tournamentsByDate[dateStr] || { regular: 0, oneTime: 0 };
          const hasRegular = tournamentInfo.regular > 0;
          const hasOneTime = tournamentInfo.oneTime > 0;
          const hasTournament = hasRegular || hasOneTime;
          
          let dayClass = 'calendar-day';
          if (isToday) dayClass += ' today';
          if (hasTournament) dayClass += ' has-tournament';
          if (calendarSelectedDateStr === dateStr) dayClass += ' selected';
          
          calendarHTML += `<div class="${dayClass}" data-date="${dateStr}" style="min-width: 0; width: 100%; box-sizing: border-box; padding: 2px; text-align: center; font-size: 0.9rem; position: relative;">`;
          calendarHTML += `<span class="day-number" style="font-weight: bold; color: ${dayColor};">${day}</span>`;
          
          if (hasRegular || hasOneTime) {
            calendarHTML += '<div class="tournament-markers">';
            
            for (let j = 0; j < tournamentInfo.regular; j++) {
              calendarHTML += '<span class="tournament-dot regular"></span>';
            }
            
            for (let j = 0; j < tournamentInfo.oneTime; j++) {
              calendarHTML += '<span class="tournament-dot one-time"></span>';
            }
            
            calendarHTML += '</div>';
          }
          
          calendarHTML += '</div>';
        }
        
        const totalDays = firstDayOfMonth + daysInMonth;
        for (let i = totalDays; i < 42; i++) {
          calendarHTML += '<div class="calendar-day empty" style="min-width: 0; width: 100%; box-sizing: border-box; padding: 2px; text-align: center; font-size: 0.9rem;"></div>';
        }
        
        calendarHTML += '</div>';
        calendar.innerHTML = calendarHTML;
        
        // 日付クリックイベントを設定
        setupCalendarClickEvents();
      }

      // トーナメントを日付ごとにグループ化（種類別）
      function groupTournamentsByDate(tournaments, year, month) {
        const grouped = {};
        
        tournaments.forEach(tournament => {
          if (!tournament.startAt) return;
          
          // startAtは既にISO文字列なのでnew Date()で変換
          const startDate = typeof tournament.startAt === 'string' 
            ? new Date(tournament.startAt)
            : tournament.startAt.toDate(); // Firestore Timestampの場合も考慮
          
          const tournamentYear = startDate.getFullYear();
          const tournamentMonth = startDate.getMonth();
          
          // 指定された月のトーナメントのみカウント
          if (tournamentYear === year && tournamentMonth === month) {
            const dateStr = formatTournamentCalendarDateStr(
              tournamentYear,
              tournamentMonth,
              startDate.getDate()
            );
            
            if (!grouped[dateStr]) {
              grouped[dateStr] = { regular: 0, oneTime: 0 };
            }
            grouped[dateStr].oneTime += 1;
          }
        });
        
        return grouped;
      }

      function clearCalendarDateSelection() {
        calendarSelectedDateStr = null;
        const selectedDateTournamentsEl = document.getElementById('selected-date-tournaments');
        if (selectedDateTournamentsEl) {
          selectedDateTournamentsEl.style.display = 'none';
        }
      }

      function getTournamentsForCalendarDate(dateStr) {
        return allTournamentsData.filter(tournament => {
          if (!tournament.startAt) return false;
          const startDate = typeof tournament.startAt === 'string'
            ? new Date(tournament.startAt)
            : tournament.startAt.toDate();
          return formatTournamentCalendarDateStr(
            startDate.getFullYear(),
            startDate.getMonth(),
            startDate.getDate()
          ) === dateStr;
        });
      }

      // カレンダーの日付クリックイベント（#tournament-calendar に1回だけバインド）
      function setupCalendarClickEvents() {
        const calendar = document.getElementById('tournament-calendar');
        if (!calendar || calendarClickEventsBound) return;
        calendarClickEventsBound = true;

        calendar.addEventListener('click', (e) => {
          const dayCell = e.target.closest('.calendar-day');
          if (!dayCell || dayCell.classList.contains('empty')) return;

          const dateStr = dayCell.dataset.date;
          if (!dateStr) return;

          calendarSelectedDateStr = dateStr;
          renderTournamentCalendar();

          const tournamentsForDate = getTournamentsForCalendarDate(dateStr);
          if (tournamentsForDate.length > 0) {
            showTournamentsForDate(dateStr, tournamentsForDate);
          } else {
            showEmptyTournamentsForDate(dateStr);
          }
        });
      }

      // 指定日のトーナメント一覧を表示
      function showTournamentsForDate(dateStr, tournamentsForDate) {
        const selectedDateTournamentsEl = document.getElementById('selected-date-tournaments');
        const selectedDateTitleEl = document.getElementById('selected-date-title');
        const selectedDateTournamentListEl = document.getElementById('selected-date-tournament-list');
        
        if (!selectedDateTournamentsEl || !selectedDateTitleEl || !selectedDateTournamentListEl) return;
        
        const tournaments = tournamentsForDate || getTournamentsForCalendarDate(dateStr);
        const date = new Date(dateStr + 'T00:00:00');
        
        selectedDateTitleEl.textContent =
          `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日のトーナメント`;
        
        selectedDateTournamentListEl.innerHTML = tournaments.map((tournament, index) =>
          renderTournamentCard(tournament, {
            cardKey: `calendar-${dateStr}-${index}`,
            showRegisterButton: false,
            showDate: true,
          })
        ).join('');
        
        selectedDateTournamentsEl.style.display = 'block';
        selectedDateTournamentsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function showEmptyTournamentsForDate(dateStr) {
        const selectedDateTournamentsEl = document.getElementById('selected-date-tournaments');
        const selectedDateTitleEl = document.getElementById('selected-date-title');
        const selectedDateTournamentListEl = document.getElementById('selected-date-tournament-list');

        if (!selectedDateTournamentsEl || !selectedDateTitleEl || !selectedDateTournamentListEl) return;

        const date = new Date(dateStr + 'T00:00:00');
        selectedDateTitleEl.textContent =
          `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日のトーナメント`;
        selectedDateTournamentListEl.innerHTML =
          '<p class="calendar-no-tournaments-msg" style="margin: 12px 0; color: #666; font-size: 0.95rem; text-align: center;">この日はトーナメントの予定がありません。</p>';

        selectedDateTournamentsEl.style.display = 'block';
        selectedDateTournamentsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // 前月へ移動（当月より前には戻れない）
      window.previousMonth = function() {
        if (isCurrentCalendarMonth(calendarCurrentMonth)) {
          return;
        }
        calendarCurrentMonth.setMonth(calendarCurrentMonth.getMonth() - 1);
        clampCalendarCurrentMonthToMinimum();
        renderTournamentCalendar();
        clearCalendarDateSelection();
      };

      // 次月へ移動
      window.nextMonth = function() {
        calendarCurrentMonth.setMonth(calendarCurrentMonth.getMonth() + 1);
        clampCalendarCurrentMonthToMinimum();
        renderTournamentCalendar();
        clearCalendarDateSelection();
      };

      // トーナメント詳細の表示切り替え
      window.toggleTournamentDetails = function(cardKey) {
        const detailsEl = document.getElementById(`${cardKey}-details`);
        const toggleEl = document.getElementById(`${cardKey}-toggle`);
        if (!detailsEl) return;
        const isVisible = detailsEl.style.display !== 'none';
        const willExpand = !isVisible;
        detailsEl.style.display = willExpand ? 'block' : 'none';
        if (toggleEl) {
          toggleEl.setAttribute('aria-expanded', String(willExpand));
          const iconEl = toggleEl.querySelector('.tournament-detail-toggle-icon');
          if (iconEl) {
            iconEl.textContent = willExpand ? '▲' : '▼';
          }
        }
      };


    </script>
  </body>
</html>
