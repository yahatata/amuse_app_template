<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スタッフページ - Amuse App</title>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- 店舗別設定ファイル -->
    <script src="./config.js"></script>

    <!-- Firebase初期化スクリプト -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
       import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

      // 設定ファイルから設定を取得
      const { firebaseConfig, liffId } = window.__CONFIG__;
      
      // Cloud Functions URLを動的に生成
      const functionsUrl = `https://us-central1-${firebaseConfig.projectId}.cloudfunctions.net`;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
       const functions = getFunctions(app);

       // グローバルに公開
       window.Firebase = { app, auth, db, functions };
    window.FirebaseAuth = { signInWithCustomToken };
       window.FirebaseFunctions = { httpsCallable };
       
       // デバッグ用: 初期化確認
       console.log('Firebase初期化完了:', {
         app: !!app,
         auth: !!auth,
         db: !!db,
         functions: !!functions
       });
      
      // LIFFとFirebase認証の初期化関数
      window.initLiffAndFirebaseAuth = async function() {
        if (!window.liff) {
          console.error("LIFF SDKが読み込まれていません。");
          return;
        }

        try {
        await liff.init({ liffId });

        if (!liff.isLoggedIn()) {
          liff.login();
            return;
        }

        const idToken = await liff.getIDToken();
          if (!idToken) {
            throw new Error("LIFFのIDトークン取得に失敗しました。");
          }

          // サーバーからFirebaseカスタムトークンを取得
          const res = await fetch(`${functionsUrl}/getFirebaseCustomToken`, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${idToken}`,
              "Content-Type": "application/json"
            }
        });

          if (!res.ok) {
            throw new Error("Firebaseカスタムトークンの取得に失敗しました。");
          }

        const { firebaseToken } = await res.json();
          if (!firebaseToken) {
            throw new Error("サーバーからトークンが返却されませんでした。");
          }

          // Firebase v10 modular SDK対応
          const { auth } = window.Firebase;
          const { signInWithCustomToken } = window.FirebaseAuth;
        await signInWithCustomToken(auth, firebaseToken);

          // 利用者情報をwindowにセット
        window.LiffFirebase = {
          idToken,
            user: auth.currentUser
        };
      } catch (e) {
          // UIにアラートは出さない
          console.error("認証処理中にエラーが発生しました", e);
      }
      };
  </script>

  <link rel="stylesheet" href="../css/common.css">
    <style>
      html, body {
        max-width: 100vw;
        width: 100vw;
        overflow-x: hidden;
        margin: 0;

</head>
<body>

  <!-- エラー表示 -->

<script type="module">
  // ページ要素の取得
  const loadingEl = document.getElementById('loading');
  const homePageEl = document.getElementById('home-page');
  const registrationPageEl = document.getElementById('registration-page');
      const qrPageEl = document.getElementById('qr-page');
      const shiftPageEl = document.getElementById('shift-page');
  const errorEl = document.getElementById('error-message');
      const successEl = document.getElementById('error-message');
  const staffInfoEl = document.getElementById('staff-info');
  const registrationFormEl = document.getElementById('registration-form');
      const shiftFormEl = document.getElementById('shift-form');

  // エラー表示関数
  function showError(message) {
    errorEl.textContent = message;
    errorEl.style.display = 'block';
    successEl.style.display = 'none';
    loadingEl.style.display = 'none';
  }

  // 成功メッセージ表示関数
  function showSuccess(message) {
    successEl.textContent = message;
    successEl.style.display = 'block';
    errorEl.style.display = 'none';
    setTimeout(() => {
      successEl.style.display = 'none';
    }, 3000);
  }

  // ページ表示関数
  function showPage(pageElement) {
    loadingEl.style.display = 'none';
        
        // 全てのページを非表示
        homePageEl.style.display = 'none';
        registrationPageEl.style.display = 'none';
        qrPageEl.style.display = 'none';
        shiftPageEl.style.display = 'none';
        
        // 指定されたページを表示
        pageElement.style.display = 'block';
        
        // activeクラスの管理
    homePageEl.classList.remove('active');
    registrationPageEl.classList.remove('active');
        qrPageEl.classList.remove('active');
        shiftPageEl.classList.remove('active');
    pageElement.classList.add('active');
  }

  // store登録確認関数（スタッフ用）
  async function checkStaffRegistration() {
    try {
      const { db } = window.Firebase;
          const { doc, getDoc, collection } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");

      // LiffFirebaseが存在するかチェック
      if (!window.LiffFirebase || !window.LiffFirebase.user) {
        throw new Error('認証が完了していません。再度ログインしてください。');
      }

      const { user } = window.LiffFirebase;

      // Firestoreでスタッフ情報を確認
      const staffDocRef = doc(db, 'staffs', user.uid);
          
      const staffDoc = await getDoc(staffDocRef);

      if (staffDoc.exists()) {
            // 登録済みの場合
        const staffData = staffDoc.data();
            
            // データの存在確認と安全なアクセス
        const name = staffData?.name || '未設定';
        const email = staffData?.email || '未設定';
        const position = staffData?.position || '未設定';
        const department = staffData?.department || '未設定';

        staffInfoEl.innerHTML = `
              <div class="info-card">
          <h3>スタッフ情報</h3>
                <div class="info-grid">
                  <div class="info-item">
                    <strong>名前:</strong> ${staffData.fullName || ''}
                  </div>
                  <div class="info-item">
                    <strong>かな:</strong> ${staffData.fullNameKana || ''}
                  </div>
                  <div class="info-item">
                    <strong>誕生日（月日）:</strong> ${staffData.birthMonthDay || ''}
                  </div>
                  <div class="info-item">
                    <strong>ログインID:</strong> ${staffData.loginId || ''}
                  </div>
                  <div class="info-item">
                    <strong>メール:</strong> ${staffData.email || ''}
                  </div>
                  <div class="info-item">
                    <strong>電話番号:</strong> ${staffData.phoneNumber || ''}
                  </div>
                </div>
              </div>
        `;
        showPage(homePageEl);
      } else {
            // 未登録の場合
        showPage(registrationPageEl);
      }
    } catch (error) {
      showError('スタッフ情報の確認に失敗しました: ' + error.message);
    }
  }

      // かな入力のバリデーション
      function validateFullNameKana(fullNameKana) {
        // ひらがなとカタカナのみ許可
        const kanaRegex = /^[ぁ-んァ-ヶー]*$/;
        return kanaRegex.test(fullNameKana);
      }
      
      // 誕生日ドロップダウン生成関数
      function generateBirthdayOptions() {
        const monthSelect = document.getElementById('birthMonth');
        const daySelect = document.getElementById('birthDay');
        
        // 月のオプションを生成
        for (let i = 1; i <= 12; i++) {
          const option = document.createElement('option');
          option.value = i.toString().padStart(2, '0');
          option.textContent = i + '月';
          monthSelect.appendChild(option);
        }
        
        // 日のオプションを生成
        for (let i = 1; i <= 31; i++) {
          const option = document.createElement('option');
          option.value = i.toString().padStart(2, 0);
          option.textContent = i + '日';
          daySelect.appendChild(option);
        }
  }

  // 登録フォーム処理
  registrationFormEl.addEventListener('submit', async (e) => {
    e.preventDefault();
        
    try {
      const fullName = document.getElementById('name').value;
      const fullNameKana = document.getElementById('kana').value;
      const birthMonth = document.getElementById('birthMonth').value;
      const birthDay = document.getElementById('birthDay').value;
      const email = document.getElementById('email').value;
      const phoneNumber = document.getElementById('phone').value;
      
      // かなのバリデーション
      if (!validateFullNameKana(fullNameKana)) {
        const charCodes = Array.from(fullNameKana).map(char => `${char}(${char.charCodeAt(0)})`).join(', ');
        throw new Error(`かなの入力に問題があります。\n入力: "${fullNameKana}"\n文字コード: ${charCodes}\nひらがなまたはカタカナで入力してください。`);
      }
      
      // 誕生日（月日）のバリデーション
      if (!birthMonth || !birthDay) {
        throw new Error('誕生日の月と日を選択してください');
      }
      
      // birthMonthDayを作成（月+日）
      const birthMonthDay = birthMonth + birthDay;
      
      // LiffFirebaseが存在するかチェック
      if (!window.LiffFirebase || !window.LiffFirebase.user) {
        throw new Error('認証が完了していません。再度ログインしてください。');
      }
      
      const { user } = window.LiffFirebase;

      // Cloud Functionを呼び出してスタッフアカウントを作成
      const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
      const functions = getFunctions(window.Firebase.app);
      const createStaffAccount = httpsCallable(functions, 'createStaffAccount');
      
      const result = await createStaffAccount({
        fullName: fullName,
        fullNameKana: fullNameKana,
        email: email,
        phoneNumber: phoneNumber,
        birthMonthDay: birthMonthDay,
      });

      showSuccess('スタッフ登録が完了しました！');
          
      // ホームページに遷移
      setTimeout(() => {
        checkStaffRegistration();
      }, 1000);
    } catch (error) {
      console.error('登録エラー:', error);
      showError('登録に失敗しました: ' + error.message);
    }
  });

      // QRコード表示関数
      window.showStaffQRCode = async () => {
        try {
          showPage(qrPageEl);
          await displayStoredStaffQRCode();
        } catch (error) {
          alert('QRコードの表示に失敗しました: ' + error.message);
        }
      };

      // ホームページに戻る関数
      window.showStaffHomePage = () => {
        showPage(homePageEl);
      };

      // 無限ループ防止用のフラグ
      let regenInFlight = false;
      let lastRegenAtMs = 0;

      // QRコード表示関数（Firestoreから取得）- 初期表示と有効期限チェック用
      async function displayStoredStaffQRCode() {
        const qrDisplay = document.getElementById('qr-code-display');
        const expiryTime = document.getElementById('qr-expiry-time');
        
        qrDisplay.innerHTML = '<p>QRコードを読み込み中...</p>';
        
        try {
          // Firebase認証の状態を確認
          const { auth } = window.Firebase;
          const currentUser = auth.currentUser;
          
          if (!currentUser) {
            qrDisplay.innerHTML = '<p>Firebase認証が完了していません。</p>';
            return;
          }
          
          // スタッフデータからQRコードURLを取得
          const { db } = window.Firebase;
          const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          const staffDoc = await getDoc(doc(db, 'staffs', currentUser.uid));
          
          if (staffDoc.exists()) {
            const staffData = staffDoc.data();
            
            if (staffData.qrCodeUrl && staffData.qrExpiresAt) {
              // 数値msを優先して比較（型揺れを防ぐ）
              const nowMs = Date.now();
              const expMs = staffData.qrExpiresAtMs || 
                           (staffData.qrExpiresAt.toDate ? staffData.qrExpiresAt.toDate().getTime() : 0);
              const isExpired = expMs <= nowMs;
              
              if (isExpired) {
                qrDisplay.innerHTML = '<p>QRコードの有効期限が切れています。新しく生成します...</p>';
                await maybeRegenerateStaffQR();
                return;
              }
              
              // デバッグ情報を表示
              qrDisplay.innerHTML = '<p>QRコード情報取得成功<br>qrCodeUrl: ' + staffData.qrCodeUrl + '<br>有効期限: ' + new Date(expMs).toLocaleString('ja-JP') + '</p>';
              
              // 有効なQRコードを表示
              qrDisplay.innerHTML = `<img src="${staffData.qrCodeUrl}" alt="QR Code" style="max-width: 300px; width: 100%;" onerror="this.style.display='none'; this.parentNode.innerHTML+='<p style=\'color:red;\'>画像の読み込みに失敗しました<br>URL: ' + staffData.qrCodeUrl + '</p>';">`;
              expiryTime.textContent = new Date(expMs).toLocaleString('ja-JP');
            } else {
              qrDisplay.innerHTML = '<p>QRコード情報が見つかりません。新しく生成します...</p>';
              await maybeRegenerateStaffQR();
            }
          } else {
            qrDisplay.innerHTML = '<p>スタッフ情報が見つかりません</p>';
            expiryTime.textContent = '有効期限: -';
          }
        } catch (error) {
          qrDisplay.innerHTML = '<p>QRコードの読み込みに失敗しました<br>エラー: ' + error.message + '</p>';
          expiryTime.textContent = '有効期限: -';
        }
      }

      // 無限ループ防止付きのQR再生成関数
      async function maybeRegenerateStaffQR() {
        const now = Date.now();
        
        // デバッグ情報を画面に表示
        const qrDisplay = document.getElementById('qr-code-display');
        qrDisplay.innerHTML = '<p>🔍 QR再生成開始<br>時刻: ' + new Date(now).toLocaleString('ja-JP') + '<br>regenInFlight: ' + regenInFlight + '<br>lastRegenAtMs: ' + (lastRegenAtMs ? new Date(lastRegenAtMs).toLocaleString('ja-JP') : 'なし') + '</p>';
        
        // 再生成中フラグとクールダウンチェック
        if (regenInFlight) {
          qrDisplay.innerHTML += '<p>⚠️ 再生成中です。スキップします。</p>';
          return;
        }
        if (lastRegenAtMs > 0 && now - lastRegenAtMs < 60000) {
          qrDisplay.innerHTML += '<p>⏰ クールダウン中です。60秒待機が必要です。</p>';
          return;
        }
        
        regenInFlight = true;
        lastRegenAtMs = now;
        
        qrDisplay.innerHTML += '<p>🚀 Cloud Function呼び出し開始...</p>';
        
        try {
          // 新しいQRコードを生成
          const { getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
          const functions = getFunctions(window.Firebase.app);
          const generateQRCode = httpsCallable(functions, 'generateQRCode');
          
          qrDisplay.innerHTML += '<p>📞 generateQRCode呼び出し中...</p>';
          
          const result = await generateQRCode({ type: 'staff' });
          
          qrDisplay.innerHTML += '<p>✅ Cloud Function完了<br>結果: ' + JSON.stringify(result.data) + '</p>';
          
          if (result.data.qrCode) {
            const expectedExpMs = result.data.expiresAt || 0;
            qrDisplay.innerHTML += '<p>⏳ サーバ反映待機開始<br>期待値: ' + new Date(expectedExpMs).toLocaleString('ja-JP') + '</p>';
            
            // サーバ反映を1回待ってから判定再開
            await waitUntilServerUpdated(expectedExpMs, 10000);
            
            qrDisplay.innerHTML += '<p>✅ サーバ反映完了</p>';
            
            // 生成完了後、保存されたQRコードを再表示
            await displayStoredStaffQRCode();
          } else {
            throw new Error('QRコードの生成に失敗しました');
          }
        } catch (error) {
          qrDisplay.innerHTML += '<p>❌ エラー発生: ' + error.message + '<br>スタック: ' + error.stack + '</p>';
          alert('QRコード生成エラー: ' + error.message);
        } finally {
          regenInFlight = false;
          qrDisplay.innerHTML += '<p>🏁 再生成処理完了</p>';
        }
      }

      // サーバ反映を待つ関数
      async function waitUntilServerUpdated(expectedExpMs, timeoutMs = 5000) {
        return new Promise(async (resolve, reject) => {
          const qrDisplay = document.getElementById('qr-code-display');
          qrDisplay.innerHTML += '<p>🔄 waitUntilServerUpdated開始<br>タイムアウト: ' + timeoutMs + 'ms<br>期待値: ' + new Date(expectedExpMs).toLocaleString('ja-JP') + '</p>';
          
          const timeout = setTimeout(() => {
            qrDisplay.innerHTML += '<p>⏰ タイムアウト発生</p>';
            reject(new Error('タイムアウト'));
          }, timeoutMs);
          
          const { db } = window.Firebase;
          const { doc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          
          qrDisplay.innerHTML += '<p>👂 Firestore監視開始...</p>';
          
          const unsubscribe = onSnapshot(doc(db, 'staffs', window.Firebase.auth.currentUser.uid), 
            { includeMetadataChanges: true }, 
            (snap) => {
              const isFromCache = snap.metadata.fromCache;
              qrDisplay.innerHTML += '<p>📡 スナップショット受信<br>fromCache: ' + isFromCache + '<br>時刻: ' + new Date().toLocaleString('ja-JP') + '</p>';
              
              // キャッシュの瞬間は無視（サーバ反映のみ見る）
              if (isFromCache) {
                qrDisplay.innerHTML += '<p>💾 キャッシュデータ - スキップ</p>';
                return;
              }
              
              const data = snap.data();
              const expMs = data?.qrExpiresAtMs || 
                           (data?.qrExpiresAt?.toDate ? data.qrExpiresAt.toDate().getTime() : 0);
              
              qrDisplay.innerHTML += '<p>📊 データ比較<br>期待値: ' + new Date(expectedExpMs).toLocaleString('ja-JP') + '<br>実際値: ' + new Date(expMs).toLocaleString('ja-JP') + '<br>差分: ' + (expMs - expectedExpMs) + 'ms</p>';
              
              if (expMs >= expectedExpMs) {
                qrDisplay.innerHTML += '<p>✅ 条件満足 - 完了</p>';
                clearTimeout(timeout);
                unsubscribe();
                resolve();
              } else {
                qrDisplay.innerHTML += '<p>⏳ 条件未満足 - 継続監視</p>';
              }
            }
          );
        });
      }

            }
            
            if (shift.end) {

                endTime = endDate.getHours().toString().padStart(2, '0') + ':' + 
                         endDate.getMinutes().toString().padStart(2, '0');

              }
            }
            
            detailsHTML += '<div class="shift-detail ' + statusClass + ' flexible-container-flex" style="box-sizing: border-box; word-wrap: break-word; overflow-wrap: break-word; justify-content: center;">';
            detailsHTML += '<div class="shift-date flexible-container-center" style="min-width: 0; flex: 1; word-wrap: break-word;">' + shift.date + '</div>';
            detailsHTML += '<div class="shift-time flexible-container-center" style="min-width: 0; flex: 1; word-wrap: break-word;">' + startTime + ' - ' + endTime + '</div>';
            detailsHTML += '<div class="shift-status flexible-container-center" style="min-width: 0; flex-shrink: 0; word-wrap: break-word;">' + status + '</div>';
            detailsHTML += '</div>';
          });
          detailsContent.innerHTML = detailsHTML;
        } else {
          detailsContent.innerHTML = '<p>シフトがありません。</p>';
        }
        
        // カレンダーの日付クリックイベントを設定
        setupCalendarDayClickEvents();
      }
      
      // カレンダーの日付クリックイベントを設定
      function setupCalendarDayClickEvents() {
        const calendarDays = document.querySelectorAll('.calendar-day:not(.empty)');
        calendarDays.forEach(day => {
          day.addEventListener('click', function() {
            const date = this.getAttribute('data-date');
            if (date) {
              // クリックされた日付のシフト詳細を表示
              showShiftDetailsForDate(date);
            }
          });
        });
      }

      function showShiftDetailsForDate(date) {
        // この関数は必要に応じて実装
        console.log('日付 ' + date + ' がクリックされました');
      }



      // 時刻選択のオプションを生成する関数
      function generateTimeOptions() {
        // 時間のオプション（0-23時）
        const hourSelects = ['shift-start-hour', 'shift-end-hour'];
        hourSelects.forEach(id => {
          const select = document.getElementById(id);
          if (select) {
            for (let hour = 0; hour < 24; hour++) {
              const option = document.createElement('option');
              option.value = hour.toString().padStart(2, '0');
              option.textContent = hour.toString().padStart(2, '0');
              select.appendChild(option);
            }
          }
        });
        
        // 分のオプション（0分と30分のみ）
        const minuteSelects = ['shift-start-minute', 'shift-end-minute'];
        minuteSelects.forEach(id => {
          const select = document.getElementById(id);
          if (select) {
            const minutes = ['00', '30'];
            minutes.forEach(minute => {
              const option = document.createElement('option');
              option.value = minute;
              option.textContent = minute;
              select.appendChild(option);
            });
          }
        });
      }
